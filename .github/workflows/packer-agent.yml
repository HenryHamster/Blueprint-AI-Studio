name: Build Agent VM Image

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build-agent-image:
    name: Packer Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.1.0
        with:
          version: "1.11.2"

      - name: Packer Init
        working-directory: ./infra/packer
        run: packer init agent.pkr.hcl

      - name: Packer Build
        working-directory: ./infra/packer
        run: |
          for zone in us-east4-b us-east1-c us-central1-f us-west1-b us-west4-a; do
            echo "Trying zone: $zone"
            if packer build -var "project_id=${{ env.PROJECT_ID }}" -var "zone=$zone" agent.pkr.hcl; then
              echo "Build succeeded in $zone"
              exit 0
            fi
            echo "Zone $zone failed, trying next..."
          done
          echo "All zones exhausted"
          exit 1
