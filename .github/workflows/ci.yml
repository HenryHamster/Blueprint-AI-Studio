name: CI

# Trigger on PR events only. A push-to-main trigger was briefly tried, but it
# re-ran the full suite post-merge (redundant with the promotion PR's CI that
# already validated that exact candidate) AND dragged in a full SERIAL testmon
# job (~11 min — the very thing sharding eliminated) just to refresh a local-dev
# cache that the system runs fine without. Net: ~triple redundant work per
# promotion for negligible value. PR CI is the gate; keep it single.
on:
  pull_request:
    # NOTE: 'edited' deliberately omitted. The autonomous pipeline PATCHes PR
    # bodies on every fix iteration (pr-helper.ts) to refresh the self-review
    # section; with 'edited' each body update fired a full ~21-min 8-shard run
    # on an unchanged tree. CI is SHA-keyed (resolve_ci_status), so 'synchronize'
    # (a real new commit) is the only event that needs to gate — body edits don't.
    #
    # 'automain' intentionally REMOVED (2026-06-20): the full 8-shard suite was
    # re-running on every task PR and rollup PR into the integration branch,
    # burning the bulk of GitHub Actions minutes. Per-task targeted tests already
    # gate each change during the task; the full suite now runs once, at the
    # automain->main promotion PR (which still targets `main` below).
    # REQUIRES companion config: the Blueprint project must have
    # build_config.requires_ci_checks=false (PATCH /api/admin/projects/{id}),
    # else automain PRs — which get zero check-runs under this trigger — stall at
    # the merge gate and FAIL at the CI-wait backstop (~60min) then cancel their
    # children. See ci_resolution.proceed_on_no_checks / requires_ci_checks.
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs when a new commit lands on the same PR. Autonomous
# fix iterations sometimes push 2-3 commits in quick succession; without this
# every commit's CI runs to completion and burns minutes on a stale tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect changes
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.result.outputs.frontend }}
      backend: ${{ steps.result.outputs.backend }}
      agent: ${{ steps.result.outputs.agent }}
    steps:
      # Self-heal a workspace that a previous job left root-owned, BEFORE
      # checkout -- because checkout is exactly what breaks.
      #
      # Self-hosted runners share _work/<repo>/<repo> across every workflow on
      # that runner. A container that bind-mounts the tree read-write and runs
      # as root leaves __pycache__, .pytest_cache and .testmondata the runner
      # user cannot delete, and the next actions/checkout dies in seconds:
      #
      #   warning: failed to remove backend/app/routers/__pycache__/...pyc: Permission denied
      #   ##[warning]Unable to clean or reset the repository. The repository will be recreated instead.
      #   ##[error]File was unable to be removed Error: EACCES: permission denied,
      #     unlink '.../backend/.pytest_cache/.gitignore'
      #
      # It presents as a landing lottery: the identical SHA is red on one
      # runner and green on the next, so it reads as a flaky test rather than a
      # broken host. That is expensive here specifically -- this workflow is
      # what gates the automain->main promotion PR, and a red run deletes that
      # PR and its release branch.
      #
      # scripts/test-backend.sh was the producer and is fixed (#17868 runs the
      # container as the calling uid). This step is the consumer-side guard: it
      # costs ~1s, it is idempotent, and it means ANY future producer -- another
      # repo on this runner, an agent VM harness, a hand-run container -- cannot
      # silently red the promotion. guard-data.yml carries the same pair.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # Main-targeting PRs intentionally run every leg below, so asking the
        # GitHub API for their changed-file list is both redundant and a single
        # point of failure during transient API incidents. Keep path filtering
        # only for any future non-main PR trigger.
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        with:
          filters: |
            frontend:
              - 'admin-ui/**'
            backend:
              - 'backend/**'
              # The runner scripts are tested by the backend job (the scripts/
              # suite runs there, and backend/testing invariant tests read
              # scripts/ through the /repo mount). A PR touching ONLY scripts/
              # would otherwise skip the backend shards entirely — so the marker
              # parity guard, which exists precisely to catch a marker added to
              # one copy and not the other, would not run on the very PR that
              # introduces the drift.
              - 'scripts/**'
            agent:
              - 'agent/**'
      - id: result
        run: |
          IS_MAIN="${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$IS_MAIN" = "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "agent=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "agent=${{ steps.filter.outputs.agent }}" >> $GITHUB_OUTPUT
          fi

  # Frontend was one ~5-min serial job (build → lint → unit suite → browser
  # viewport suite). It's now split into parallel legs: build+lint and the
  # happy-dom unit suite don't need Playwright/Chromium, so only the browser
  # viewport leg installs it; and the unit suite is sharded so it no longer
  # runs serially behind everything else. The `CI / Frontend` gate job (below)
  # carries the required-status-check name the ruleset expects.
  #
  # NOTE: the old per-job "broken on main" baseline escape-hatch
  # (frontend-status.txt) was dropped. It only populated on a push-to-main
  # trigger, which this workflow no longer has (PR-only — see the header), so
  # it had been inert (failures already always blocked). Each leg now fails
  # directly.
  frontend-build:
    name: CI / Frontend (build + lint)
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./admin-ui
        run: |
          # --prefer-offline serves already-cached tarballs from the runner's
          # warm npm cache instead of re-hitting the registry, so a
          # registry blip can't flake a warm run ("npm ERR! registry
          # unreachable"). Backoff retry absorbs the esbuild ETXTBSY postinstall
          # race and transient registry degradation on a cold cache.
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --fund=false && exit 0
            echo "::warning::npm ci failed (attempt $i/3) — retrying"
            sleep $((i * 5))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Build (tsc + vite)
        working-directory: ./admin-ui
        env:
          VITE_API_URL: http://localhost:8080
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
        run: npm run build

      - name: Lint
        working-directory: ./admin-ui
        run: npx eslint .

  frontend-unit:
    name: CI / Frontend (unit shard ${{ matrix.shard }})
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    # The unit suite (~1400 tests) runs in happy-dom (not a real browser), so
    # no Playwright. Split into 2 parallel legs via vitest's built-in --shard;
    # wall-clock ≈ the slower half.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./admin-ui
        run: |
          # --prefer-offline serves already-cached tarballs from the runner's
          # warm npm cache instead of re-hitting the registry, so a
          # registry blip can't flake a warm run ("npm ERR! registry
          # unreachable"). Backoff retry absorbs the esbuild ETXTBSY postinstall
          # race and transient registry degradation on a cold cache.
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --fund=false && exit 0
            echo "::warning::npm ci failed (attempt $i/3) — retrying"
            sleep $((i * 5))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Unit tests (happy-dom, shard ${{ matrix.shard }}/2)
        working-directory: ./admin-ui
        run: npx vitest run --shard=${{ matrix.shard }}/2

  frontend-viewport:
    name: CI / Frontend (viewport shard ${{ matrix.shard }}/4)
    # Browser dependencies stay inside the version-pinned Playwright container,
    # but checkout and npm run as the unprivileged runner user. A job-level
    # container runs actions/checkout as root and can leave a persistent
    # self-hosted workspace unwritable for the next job.
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    # A first run on one of the isolated per-runner Docker daemons may need to
    # pull the pinned Playwright image. Keep that cold-cache budget separate
    # from the bounded browser test runtime below.
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Each self-hosted runner already keeps its own npm cache and the
          # install below prefers it. Avoid four concurrent setup-node cache
          # save hooks: they serialize matrix completion after the browser
          # process has already exited and prevent the next viewport shards
          # from being scheduled.

      - name: Install dependencies
        working-directory: ./admin-ui
        run: |
          # --prefer-offline serves already-cached tarballs from the runner's
          # warm npm cache instead of re-hitting the registry, so a
          # registry blip can't flake a warm run ("npm ERR! registry
          # unreachable"). Backoff retry absorbs the esbuild ETXTBSY postinstall
          # race and transient registry degradation on a cold cache.
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --fund=false && exit 0
            echo "::warning::npm ci failed (attempt $i/3) — retrying"
            sleep $((i * 5))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Viewport coverage invariants
        # Static guard (no browser): every operator component has a viewport
        # test, required assertions present, escape-hatch budget within limit.
        # Was chained ahead of the browser run inside `npm run test:viewport`.
        working-directory: ./admin-ui
        run: node scripts/check-viewport-coverage.js

      - name: Viewport tests (browser mode)
        id: viewport
        continue-on-error: true
        # Use only this runner's isolated Docker daemon. Matching the host
        # UID/GID keeps failure screenshots and all other bind-mounted output
        # writable by later jobs on this persistent runner.
        run: |
          playwright_version="$(
            node -p "require('playwright-core/package.json').version"
          )"
          if [[ ! "$playwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Playwright version: ${playwright_version}"
            exit 1
          fi
          playwright_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          container_name="blueprint-viewport-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${{ matrix.shard }}"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          if [[ ! -x "$node_root/bin/node" ]]; then
            echo "::error::Node tool root is not executable: ${node_root}"
            exit 1
          fi

          # A hard job timeout kills the Docker CLI, not necessarily its
          # container. Remove only our labelled leftovers on this runner's
          # isolated daemon before starting, and trap every normal/timeout exit.
          mapfile -t stale_ids < <(
            docker ps -aq --filter label=com.blueprint.ci=viewport
          )
          if (( ${#stale_ids[@]} > 0 )); then
            docker rm -f "${stale_ids[@]}"
          fi
          cleanup_viewport() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup_viewport EXIT INT TERM

          # Pull explicitly so a cold daemon gets a bounded image-download
          # budget without consuming the browser suite's own timeout.
          if ! docker image inspect "$playwright_image" >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=30s 20m \
              docker pull "$playwright_image"
          fi

          set +e
          bash scripts/run_viewport_with_retry.sh 3m "$container_name" \
            docker run --init \
            --name "$container_name" \
            --label com.blueprint.ci=viewport \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --network=none \
            --pids-limit=512 \
            --memory=8g \
            --cpus=6 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --shm-size=2g \
            --env HOME=/tmp \
            --env CI=true \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env VITE_API_URL=http://localhost:8080 \
            --env VITE_FIREBASE_API_KEY=ci-placeholder \
            --env VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com \
            --env VITE_FIREBASE_PROJECT_ID=ci-placeholder \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work \
            --mount type=bind,src="$node_root",dst=/opt/ci-node,readonly \
            --workdir /work/admin-ui \
            "$playwright_image" \
            bash -euo pipefail -c '
              # The image bundles Node 24, while this workflow and dependency
              # tree are pinned to Node 20. Use the read-only setup-node
              # toolchain. Each matrix job gets a fresh browser provider and a
              # bounded quarter of the suite; this prevents a provider teardown
              # stall from stranding the other shards.
              node --version
              npx --no-install vitest run --config vitest.viewport.config.ts --shard=${{ matrix.shard }}/4
            '
          viewport_status=$?
          set -e
          exit "$viewport_status"

      - name: Clean viewport container
        if: always()
        run: |
          container_name="blueprint-viewport-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${{ matrix.shard }}"
          docker rm -f "$container_name" >/dev/null 2>&1 || true

      # Failure screenshots are visual regressions; the stack trace alone
      # rarely makes the issue diagnosable. screenshotFailures=true in
      # vitest.viewport.config.ts writes PNGs into vitest's default browser
      # output dir(s); we glob the likely locations and let the action
      # ignore missing paths so a passing run doesn't fail this step.
      - name: Upload viewport failure screenshots
        if: steps.viewport.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: viewport-failure-screenshots-shard-${{ matrix.shard }}
          path: |
            admin-ui/**/__screenshots__/**/*.png
            admin-ui/.vitest/**/*.png
            admin-ui/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if viewport tests failed
        if: steps.viewport.outcome == 'failure'
        run: |
          echo "::error::Viewport (browser-mode) tests failed"
          exit 1

  # Required-status-check gate: the "mainProtection" ruleset requires a check
  # named exactly "CI / Frontend". The split legs above report under different
  # names, so this aggregator carries the canonical name and passes iff every
  # leg succeeded — or frontend was skipped because the PR didn't touch
  # admin-ui (detect=false), which must still satisfy the required check.
  frontend-gate:
    name: CI / Frontend
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 5
    needs: [frontend-build, frontend-unit, frontend-viewport]
    if: always()
    steps:
      - name: Require all frontend legs to pass
        run: |
          B="${{ needs.frontend-build.result }}"
          U="${{ needs.frontend-unit.result }}"
          V="${{ needs.frontend-viewport.result }}"
          for r in "$B" "$U" "$V"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Frontend leg failed (build=$B unit=$U viewport=$V)"
              exit 1
            fi
          done
          echo "Frontend legs OK (build=$B unit=$U viewport=$V)"

  # Backend test image: a deps-only layer (apt + pip), cached in GHCR keyed by a
  # hash of requirements.txt + Dockerfile. Built once when those change; the 8
  # shards below then pull it and mount the checked-out source over /app at run
  # time — instead of each shard rebuilding the full image from scratch every
  # run (~34s × 8 of redundant `pip install`). GHCR images aren't branch-scoped,
  # so this cache is shared across all PRs (unlike the GH Actions cache).
  # Best-effort: if login/build/push can't happen (e.g. a fork PR's read-only
  # token), the shards fall back to building the deps stage locally — never worse
  # than before. This job never fails the run (exits 0); a genuine deps build
  # error surfaces in the shards instead.
  backend-deps:
    name: CI / Backend deps image
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      reqhash: ${{ steps.hash.outputs.reqhash }}
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      - name: Compute deps hash
        id: hash
        run: |
          REQHASH=$(cat backend/requirements.txt backend/Dockerfile | sha256sum | cut -c1-16)
          echo "reqhash=$REQHASH" >> "$GITHUB_OUTPUT"
          echo "deps tag: $REQHASH"

      - name: Build + push deps image if missing
        env:
          REQHASH: ${{ steps.hash.outputs.reqhash }}
        run: |
          IMG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/backend-test-deps"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null \
            || { echo "::warning::ghcr login failed — shards will build the deps stage locally"; exit 0; }
          if docker manifest inspect "$IMG:$REQHASH" >/dev/null 2>&1; then
            echo "deps image $IMG:$REQHASH already cached — nothing to build"
            exit 0
          fi
          echo "deps image missing — building --target deps and pushing $IMG:$REQHASH"
          # python:3.11-slim base pull can hit a Docker Hub connectivity blip;
          # retry, then fall back to Google's Docker Hub mirror and retag so the
          # FROM in ./backend/Dockerfile resolves the image locally (no re-pull).
          ok=
          for src in python:3.11-slim mirror.gcr.io/library/python:3.11-slim; do
            for i in 1 2 3; do
              docker pull "$src" && { ok=1; break; }
              echo "::warning::$src pull failed (attempt $i/3) — retrying"
              sleep $((i * 10))
            done
            if [ -n "$ok" ]; then
              [ "$src" = python:3.11-slim ] || docker tag "$src" python:3.11-slim
              break
            fi
          done
          docker build --target deps -t "$IMG:$REQHASH" ./backend \
            || { echo "::warning::deps build failed — shards will build locally and surface the error"; exit 0; }
          for i in 1 2 3; do
            docker push "$IMG:$REQHASH" && exit 0
            echo "::warning::ghcr push failed (attempt $i/3) — retrying"
            sleep $((i * 5))
          done
          echo "::warning::deps image push failed after retries — shards will build locally"
          exit 0

  backend:
    name: CI / Backend (shard ${{ matrix.shard }})
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    # Hard ceiling: catches a hung test instead of letting GH Actions' 360-min
    # default stall the runner for 6h and wedge the rollup. Raised 10 -> 20
    # (2026-07-23), then 20 -> 30 (2026-07-24): shards are balanced by even test
    # COUNT unless a backend/.test_durations file is committed, and there isn't
    # one, so the spread is wide — on run 30053310362 shards 3-8 finished in
    # 3:48-8:32 while shard 2 was healthy but only 47% done when the 10-min
    # ceiling killed it. At 20 min shard 2 got all the way to 94%, still passing,
    # and was killed with ~2 min of work left (run 30062720109); the other seven
    # shards finished in 4:37-8:38, so 30 leaves real headroom on the one slow leg
    # without meaningfully delaying detection of a genuine hang. On the initial
    # single self-hosted worker a hung shard also holds up queued siblings, so
    # retaining this ceiling is especially important.
    # A ceiling that kills a *passing* shard silently drops its remaining tests
    # from the merge gate, which is worse than catching a hang 10 min later
    # (fail-fast is false, so a hung shard never blocks its siblings). The real
    # fix is committing .test_durations so pytest-split balances by time.
    # This ceiling is the CATCH-ALL, and it is the only thing standing between a
    # non-interruptible block and GH Actions' 360-min default. Note the per-test
    # budget below is --timeout=300 --timeout-method=signal: 300s (raised from
    # 30s on 2026-08-26) is a HANG detector, not a performance budget. At 30s it
    # was killing healthy whole-tree read+parse scans under host I/O contention
    # and reding shards on candidates that had just gone green at the same sha
    # -- on a promotion PR that deletes the release branch. The inner-operation
    # ceiling that catches genuine budget inversions stayed at 30s; the two are
    # now separate constants in backend/testing/test_harness_timeout_budgets.py
    # and that guard fails if anyone moves them back together. A shard runs ~11
    # min, so even a full 300s hang leaves real headroom under the 30-min cap.
    timeout-minutes: 30
    needs: [detect, backend-deps]
    if: needs.detect.outputs.backend == 'true'
    # Sharded: the suite (~7k tests) is split into 8 legs via pytest-split
    # (--splits 8 --group N). Each leg is an ordinary SERIAL pytest run with its
    # own PostgreSQL lifecycle. GitHub distributes them across hamsterwheel's
    # matching runner instances. Splits are deterministic and use even test
    # counts unless backend/.test_durations is committed, in which case
    # pytest-split balances by time. The testmon cache refresh (needs the whole
    # suite in one process) is a separate main-only job.
    strategy:
      fail-fast: false
      # Match the four-worker hamsterwheel pool. This keeps a future larger
      # fleet from letting one PR consume more than the host's intended share.
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
      pull-requests: read
      packages: read
    # PostgreSQL is started manually (in the first step) instead of as a
    # `services:` container so we can retry the Docker Hub image pull. A
    # service-container pull only auto-retries 3x over ~45s; a Docker Hub blip
    # (registry-1.docker.io connection timeouts) lasting longer than that fails
    # the whole shard during job-setup, before any step runs — a pure-infra
    # flake that the orchestrator used to misread as a code failure and burn a
    # cold fix-VM on. The retry loop below absorbs it. Every shard gets a private
    # Docker network and uniquely named PostgreSQL container, so shards from this
    # run, reruns, and separate PRs can execute concurrently without sharing a
    # host port or colliding with hamsterwheel's own PostgreSQL service.
    env:
      CI_NETWORK: blueprint-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      POSTGRES_CONTAINER: blueprint-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      TEST_DB_URL: postgresql+asyncpg://test:test@postgres:5432/test_blueprint
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      # Persistent runners are not discarded after every job. Each runner owns
      # a dedicated Docker daemon and executes one job at a time, so any
      # matching resources already present on that daemon are stale leftovers
      # from a cancelled or interrupted job (possibly with a different run ID).
      - name: Clean stale PostgreSQL resources
        run: |
          mapfile -t stale_networks < <(
            docker network ls --format '{{.Name}}' |
              sed -n '/^blueprint-ci-/p'
          )
          for network in "${stale_networks[@]}"; do
            mapfile -t attached_containers < <(
              docker ps -aq --filter "network=$network"
            )
            if (( ${#attached_containers[@]} )); then
              docker rm -f "${attached_containers[@]}"
            fi
            docker network rm "$network"
          done

          mapfile -t stale_containers < <(
            docker ps -aq --filter "name=blueprint-ci-postgres-"
          )
          if (( ${#stale_containers[@]} )); then
            docker rm -f "${stale_containers[@]}"
          fi

      - name: Start PostgreSQL (pull with retry + mirror fallback)
        run: |
          docker network create "$CI_NETWORK"
          # registry-1.docker.io (Docker Hub) intermittently times out from GH
          # runners ("context deadline exceeded" on the /v2/ handshake) — a
          # connectivity blip, not a rate limit. When it outlasts the retry
          # window the shard hard-fails (exit 125: the loop falls through and
          # docker run re-pulls and dies). mirror.gcr.io is Google's public
          # pull-through cache of Docker Hub's library images; it rides a
          # different network path, so we fall back to it and retag to
          # postgres:15 (docker run below is then unchanged). public.ecr.aws is
          # AWS ECR Public's rate-limit-free mirror of the Docker library on a
          # THIRD network path — #12492 hard-failed when BOTH Docker Hub and
          # mirror.gcr.io were down at once, so a third independent source (plus
          # one extra retry) closes that window.
          ok=
          for src in \
            postgres:15 \
            mirror.gcr.io/library/postgres:15 \
            public.ecr.aws/docker/library/postgres:15; do
            for i in 1 2 3 4; do
              docker pull "$src" && { ok=1; break; }
              echo "::warning::$src pull failed (attempt $i/4) — backing off"
              sleep $((i * 10))
            done
            if [ -n "$ok" ]; then
              [ "$src" = postgres:15 ] || docker tag "$src" postgres:15
              break
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::could not pull postgres:15 from Docker Hub, mirror.gcr.io, or public.ecr.aws"
            exit 1
          fi
          docker run -d --name "$POSTGRES_CONTAINER" \
            --network "$CI_NETWORK" --network-alias postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test_blueprint \
            postgres:15
          # Require the readiness probe to hold, and trust the loop's own
          # result instead of re-running the check afterwards.
          #
          # Observed on run 32804531811, backend shard 3: the loop printed
          # "PostgreSQL ready after 3 check(s)" and the job then failed with
          # "PostgreSQL did not become ready" 0.14s later, on a database that
          # was healthy -- the dumped container logs still showed initdb doing
          # post-bootstrap initialization. So the first probe went true against
          # a server that was about to go away, and the confirmation probe
          # landed in that window.
          #
          # Two independent defects, and both are fixed here:
          #
          #  1. The confirmation re-ran pg_isready instead of recording what
          #     the loop already determined. That re-poll can only ever turn a
          #     success into a failure, never the reverse -- it is pure
          #     downside. A $ready flag removes it.
          #
          #  2. A single successful probe was treated as settled. Requiring
          #     two consecutive successes means a probe that goes true against
          #     a server that is about to restart does not latch, which also
          #     stops the suite from starting against one.
          #
          # This reds a random shard of a healthy candidate, so on the
          # promotion PR -- where a red run deletes the PR and its release
          # branch -- it presents as an unreproducible flake. It is not: it is
          # a control-flow bug that fires whenever the probe and the restart
          # overlap.
          ready=
          streak=0
          for i in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U test -d test_blueprint >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 2 ]; then
                ready=1
                echo "PostgreSQL ready after $i check(s)"
                break
              fi
            else
              streak=0
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::PostgreSQL did not become ready"
            docker logs "$POSTGRES_CONTAINER" || true
            exit 1
          fi

      - name: Resolve backend deps image (pull cached, else build)
        id: deps
        env:
          REQHASH: ${{ needs.backend-deps.outputs.reqhash }}
        run: |
          # CLAUDE.md is mounted into /app for the steps below (some tests read
          # it); the deps image deliberately has no source baked in.
          cp CLAUDE.md backend/CLAUDE.md
          IMG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/backend-test-deps"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
          if [ -n "$REQHASH" ] && docker pull "$IMG:$REQHASH" 2>/dev/null; then
            echo "using cached deps image $IMG:$REQHASH"
            echo "image=$IMG:$REQHASH" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::deps image unavailable — building --target deps locally"
            ok=
            for src in python:3.11-slim mirror.gcr.io/library/python:3.11-slim; do
              for i in 1 2 3; do
                docker pull "$src" && { ok=1; break; }
                echo "::warning::$src pull failed (attempt $i/3) — retrying"
                sleep $((i * 10))
              done
              if [ -n "$ok" ]; then
                [ "$src" = python:3.11-slim ] || docker tag "$src" python:3.11-slim
                break
              fi
            done
            docker build --target deps -t "backend-test-deps:${REQHASH:-local}" ./backend
            echo "image=backend-test-deps:${REQHASH:-local}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify app imports
        run: |
          docker run --rm --network "$CI_NETWORK" -v "$PWD/backend:/app:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e DATABASE_URL=${{ env.TEST_DB_URL }} \
            -e AGENT_JWT_SECRET=ci-test-secret-padding-to-meet-32-byte-minimum \
            -e WS_TICKET_SECRET=ci-test-secret-padding-to-meet-32-byte-minimum \
            ${{ steps.deps.outputs.image }} \
            python -c "from app.main import app; print(f'OK: {len(app.routes)} routes')"

      - name: Run migrations on test DB
        run: |
          docker run --rm --network "$CI_NETWORK" -v "$PWD/backend:/app:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e DATABASE_URL=${{ env.TEST_DB_URL }} \
            ${{ steps.deps.outputs.image }} \
            alembic upgrade head

      - name: Run tests (shard ${{ matrix.shard }}/8)
        id: run_tests
        continue-on-error: true
        run: |
          # pytest-split slices the suite into 8 groups balanced by the
          # committed backend/.test_durations file (COPY'd into the image at
          # /app/.test_durations, which pytest-split auto-detects). This leg runs
          # group ${{ matrix.shard }} SERIALLY in its own postgres — no
          # parallel-DB-isolation concerns. If the durations file is stale/absent
          # pytest-split falls back to an even count-based split (graceful).
          # Disable -e so pytest's non-zero exit doesn't short-circuit the
          # failure-extraction below; we propagate the code via $pytest_status.
          set +e
          # pytest-split writes the shard's timing partial here. It needs its own
          # WRITABLE mount: /app is bound read-only, so --durations-path cannot
          # point anywhere under it. Created on the host so it belongs to the
          # runner user rather than to the container.
          mkdir -p "$PWD/shard-durations"
          run_shard() {
            # Fail Google Auth's non-GCE metadata probes immediately. On a
            # residential network the default metadata IP can linger long
            # enough to trip otherwise healthy tests' 30-second timeout.
            # /repo mount + CI env: the runner-script invariant tests
            # (backend/testing/test_local_runner_terminal_log.py etc.) resolve
            # scripts/ via /repo and HARD-FAIL (not skip) when CI is set, so
            # they enforce in the promotion gate instead of silently skipping.
            # Start from a NON-EXISTENT durations path on every attempt.
            # PytestSplitCachePlugin SEEDS its cache by reading --durations-path
            # at startup and writes that dict back updated -- so pointing a shard
            # at a populated file yields a "complete" map that is ~7/8 stale
            # carry-over from other shards. Merging eight of those lets one
            # shard's echo clobber another's fresh measurement. Reproduced
            # directly in #17992; the merge tool defends against it a second way
            # by treating a value bit-identical to the baseline as carry-over.
            # This also stops a retry inheriting its own previous attempt.
            rm -f "$PWD/shard-durations/shard-${{ matrix.shard }}.json"
            # --user/HOME/USER: run as the runner user, not root. This is the
            # idiom scripts/test-backend.sh already applies to every local and
            # agent-VM run of this same image, so the image is known to work
            # non-root; these two lanes are the ones that call `docker run`
            # directly and therefore missed it. Root-owned droppings in a
            # bind-mounted tree are not cosmetic: on a SHARED self-hosted runner
            # one poisoned run makes the same SHA pass or fail depending on which
            # runner picks it up, and a git read inside the container sees a
            # workspace it does not own (`detected dubious ownership`, exit 128 --
            # the shape that killed the v45 promotion attempt). HOME is
            # redirected because it defaults to "/", which a non-root uid cannot
            # write; USER is exported because --user injects a uid the image's
            # /etc/passwd does not know and getpass.getuser() raises KeyError.
            #
            # The "Reclaim workspace from root-owned container droppings" steps
            # are deliberately LEFT IN PLACE. If this works they become no-ops;
            # if it does not, they still protect the next job. Delete them in a
            # follow-up once a promotion run proves the droppings are gone --
            # never in the same commit that might create them.
            docker run --rm --network "$CI_NETWORK" -v "$PWD/backend:/app:ro" \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e USER="$(id -un)" \
              -v "$PWD:/repo:ro" \
              -v "$PWD/shard-durations:/durations" \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -e GCE_METADATA_IP=127.0.0.1 \
              -e GCE_METADATA_HOST=127.0.0.1:9 \
              -e CI=true \
              -e DATABASE_URL=${{ env.TEST_DB_URL }} \
              -e USE_TEST_POSTGRES=true \
              -e AGENT_JWT_SECRET=ci-test-secret-padding-to-meet-32-byte-minimum \
              -e WS_TICKET_SECRET=ci-test-secret-padding-to-meet-32-byte-minimum \
              ${{ steps.deps.outputs.image }} \
              python -m pytest testing/ --splits 8 --group ${{ matrix.shard }} \
                --store-durations \
                --durations-path /durations/shard-${{ matrix.shard }}.json \
                -v --tb=short --timeout=300 --timeout-method=signal --log-cli-level=WARNING 2>&1 | tee test-output.txt
            return ${PIPESTATUS[0]}
          }
          # Extract failed/erroring test IDs from pytest's "short test summary
          # info" section. Fixture setup/teardown regressions are reported as
          # ERROR (not FAILED) and must be compared against the baseline too.
          # Restrict matches to collected backend node IDs: captured application
          # logs can legitimately start with ERROR while the test still passes.
          extract_failures() {
            grep -E "^(FAILED|ERROR) testing/[^[:space:]]+::" test-output.txt | sed -E 's/^(FAILED|ERROR) //' | sed 's/ -.*//' | sort -u > pr-test-failures.txt || true
          }
          run_shard; pytest_status=$?
          extract_failures

          # A non-zero exit with no FAILED/ERROR summary is a CRASH/HANG (timeout, OOM,
          # collection error, or a Docker/DB blip) — NOT real test failures. Retry
          # the shard ONCE so a transient crash self-heals instead of writing the
          # sentinel, which always counts as net-new and blocks the promotion gate
          # (the crash-sentinel wedge). Real FAILED lines are NOT retried — a
          # genuine FAILED or ERROR result fails fast on the first run.
          if [ "$pytest_status" -ne 0 ] && [ ! -s pr-test-failures.txt ]; then
            echo "::warning::shard ${{ matrix.shard }} exited $pytest_status with no FAILED/ERROR summary (crash/hang) — retrying once"
            run_shard; pytest_status=$?
            extract_failures
          fi
          set -e

          # Fallback: STILL a non-zero exit with no FAILED summary after the retry.
          # Surface a sentinel + the tail so the Evaluate step is useful.
          if [ "$pytest_status" -ne 0 ] && [ ! -s pr-test-failures.txt ]; then
            echo "<pytest crashed or hung; no FAILED/ERROR summary captured>" > pr-test-failures.txt
            echo ""
            echo "=== Last 50 lines of pytest output ==="
            tail -50 test-output.txt
          fi

          exit $pytest_status

      # Belt and braces. Since #17990 the shard container runs as the runner
      # user, so this should already be a no-op -- but the upload must not be
      # the thing that discovers otherwise, and a root-owned leftover here fails
      # the NEXT checkout on this shared runner rather than this job.
      - name: Normalize shard-durations ownership
        if: always()
        run: chmod -R a+rwX shard-durations 2>/dev/null || true

      # if-no-files-found: ignore -- a shard that died before pytest wrote its
      # partial must not turn a real test failure into a confusing upload error.
      # The merge job tolerates a missing shard loudly and keeps those tests'
      # baseline entries.
      - name: Upload shard durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-durations-${{ matrix.shard }}
          path: shard-durations/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

      # Standalone host services and installers live outside backend/testing, so
      # the sharded suite above never collects them. Run their pure unit suites
      # once from the read-only repository mount. This covers runner isolation,
      # the transactional local-control-plane installer and role generators, and
      # the recovery restore verifier without needing Docker or cloud access.
      - name: Runner-script suite (scripts/)
        if: matrix.shard == 1
        run: |
          # Same runner-user mapping as the shard lane above, and for the
          # same reason -- see the comment there. This lane reads /repo, which
          # is the mount a container-side `git log` trips over when the uid
          # inside does not match the checkout's owner.
          docker run --rm -v "$PWD:/repo:ro" -w /repo/scripts \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e USER="$(id -un)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e CI=true \
            ${{ steps.deps.outputs.image }} \
            python -m pytest \
              test_runner_isolation.py \
              test_walkthrough_stack.py \
              test_blueprint_node.py \
              test_local_api_service.py \
              test_local_control_plane_services.py \
              test_local_postgres_backup_service.py \
              test_local_postgres_service.py \
              test_tailscale_funnel_service.py \
              ../infra/recovery/restore_verifier/test_verify_restore.py \
              -v --tb=short --noconftest -p no:cacheprovider

      - name: Save test failures baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Save both the failure list and overall status
          if [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
            echo "BROKEN" > backend-status.txt
          else
            echo "OK" > backend-status.txt
          fi
          # Combine into one baseline file
          echo "---FAILURES---" >> backend-status.txt
          cat pr-test-failures.txt >> backend-status.txt 2>/dev/null || true

      - name: Upload backend baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: backend-status.txt
          key: ci-baseline-backend-shard${{ matrix.shard }}-${{ github.sha }}

      - name: Load main baseline (PR only)
        if: github.event_name == 'pull_request' && steps.run_tests.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: backend-status.txt
          key: ci-baseline-backend-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: ci-baseline-backend-shard${{ matrix.shard }}-

      - name: Evaluate test results
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Failed tests on this PR:"
          cat pr-test-failures.txt 2>/dev/null || echo "(none captured)"

          # On main push, just fail — baseline is already saved above
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Backend tests failed on main"
            exit 1
          fi

          # On PR: compare against main baseline
          if [ ! -f backend-status.txt ]; then
            echo "No main baseline found — all failures count as new"
            exit 1
          fi

          # Extract main's failed tests from baseline
          sed -n '/---FAILURES---/,$p' backend-status.txt | tail -n +2 | sort -u > main-failures.txt

          if [ ! -s pr-test-failures.txt ]; then
            echo "::error::Backend tests failed but no specific test failures captured"
            exit 1
          fi

          # Find NEW failures (in PR but not in main)
          NEW_FAILURES=$(comm -23 pr-test-failures.txt main-failures.txt)

          if [ -n "$NEW_FAILURES" ]; then
            echo "::error::NEW test failures introduced by this PR:"
            echo "$NEW_FAILURES"
            echo ""
            echo "Tests also failing on main (not blocking):"
            comm -12 pr-test-failures.txt main-failures.txt || true
            exit 1
          fi

          echo "::warning::All test failures are inherited from main — not blocking PR"
          cat pr-test-failures.txt

      - name: Migration linter
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          BASE_BRANCH="${{ github.event.pull_request.base.ref || 'main' }}"
          # This step was vacuous for its entire life. actions/checkout@v4
          # defaults to fetch-depth 1, so origin/$BASE_BRANCH does not exist in
          # this workspace; the diff below died, `2>/dev/null || true` swallowed
          # the error, NEW_MIGRATIONS came back empty, and EVERY run printed
          # "No new migrations — skipping" and exited 0 — including runs that
          # did add migrations. Fetch the base ref explicitly and let a failure
          # fail the job: a guard against a class that bricks a deploy must
          # never report "clean" because it could not look.
          git -c "safe.directory=$PWD" fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          NEW_MIGRATIONS=$(git -c "safe.directory=$PWD" diff --name-only --diff-filter=A "origin/$BASE_BRANCH" -- 'backend/alembic/versions/*.py')
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations — skipping"
            exit 0
          fi
          echo "New migrations under review:"
          echo "$NEW_MIGRATIONS"
          VIOLATIONS=$(echo "$NEW_MIGRATIONS" | xargs grep -l "nullable=False" 2>/dev/null | xargs grep -L "server_default" 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Migration safety violation: nullable=False without server_default in:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Migration linter passed"

      - name: Stop PostgreSQL resources
        if: always()
        run: |
          docker rm -f "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true

  # Required-status-check gate: the "mainProtection" ruleset requires a check
  # named exactly "CI / Backend". The matrix legs above report as "CI / Backend
  # (shard N)", so this aggregator carries the canonical name and passes iff
  # every shard succeeded — or backend was skipped because the PR didn't touch
  # it (detect=false), which must still satisfy the required check.
  backend-gate:
    name: CI / Backend
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 5
    needs: backend
    if: always()
    steps:
      - name: Require all backend shards to pass
        run: |
          R="${{ needs.backend.result }}"
          if [ "$R" = "success" ] || [ "$R" = "skipped" ]; then
            echo "Backend shards: $R — OK"
            exit 0
          fi
          echo "::error::Backend shards result: $R"
          exit 1

  agent:
    name: CI / Agent
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.agent == 'true'
    steps:
      # See the Detect changes job for why this runs before checkout.
      - name: Reclaim workspace from root-owned container droppings
        run: |
          [ -d "$PWD" ] || exit 0
          docker run --rm -v "$PWD:/w" --entrypoint sh alpine:3.20 \
            -c "chown -R $(id -u):$(id -g) /w" 2>/dev/null \
            || echo "::warning::workspace reclaim failed; a stale root-owned file may fail checkout"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./agent
        run: |
          # --prefer-offline serves already-cached tarballs from the runner's
          # warm npm cache instead of re-hitting the registry, so a
          # registry blip can't flake a warm run ("npm ERR! registry
          # unreachable"). Backoff retry absorbs the esbuild ETXTBSY postinstall
          # race and transient registry degradation on a cold cache.
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --fund=false && exit 0
            echo "::warning::npm ci failed (attempt $i/3) — retrying"
            sleep $((i * 5))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Type check
        id: typecheck
        continue-on-error: true
        working-directory: ./agent
        run: npx tsc --noEmit

      - name: Save result for baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.typecheck.outcome }}" = "failure" ]; then
            echo "BROKEN" > agent-status.txt
          else
            echo "OK" > agent-status.txt
          fi

      - name: Upload agent status (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: agent-status.txt
          key: ci-baseline-agent-${{ github.sha }}

      - name: Load main baseline (PR only)
        if: github.event_name == 'pull_request' && steps.typecheck.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: agent-status.txt
          key: ci-baseline-agent-${{ github.sha }}
          restore-keys: ci-baseline-agent-

      - name: Evaluate result
        if: steps.typecheck.outcome == 'failure'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f agent-status.txt ] && grep -q "BROKEN" agent-status.txt; then
            echo "::warning::Agent CI failed but is also broken on main — not blocking PR"
          else
            echo "::error::Agent type check failed"
            exit 1
          fi

      # Blocking — the vitest suite silently went red on automain while only
      # tsc gated this job (reports 063e94c5 / 6637f511). Unlike the typecheck
      # above there is no main-baseline forgiveness: a red agent suite blocks
      # the PR that would merge it. Runs after the typecheck baseline steps so
      # a test failure on a main push still records the typecheck baseline.
      - name: Unit tests
