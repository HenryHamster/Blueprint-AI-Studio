name: CI

# Trigger on PR events only — branch-protection requires PR CI to pass before
# merge, so the previous post-merge `push: branches: [main]` run was redundant
# and ~50% of CI minutes were duplicate. Re-add the push trigger if integration
# issues from merge-time semantic conflicts start slipping past PR CI.
on:
  pull_request:
    branches: [main, automain]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Cancel superseded runs when a new commit lands on the same PR. Autonomous
# fix iterations sometimes push 2-3 commits in quick succession; without this
# every commit's CI runs to completion and burns minutes on a stale tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.result.outputs.frontend }}
      backend: ${{ steps.result.outputs.backend }}
      agent: ${{ steps.result.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            frontend:
              - 'admin-ui/**'
            backend:
              - 'backend/**'
            agent:
              - 'agent/**'
      - id: result
        run: |
          IS_MAIN="${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$IS_MAIN" = "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "agent=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "agent=${{ steps.filter.outputs.agent }}" >> $GITHUB_OUTPUT
          fi

  frontend:
    name: CI / Frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-ui
        run: npm ci || { echo "::warning::npm ci failed (esbuild ETXTBSY postinstall race) - retrying once"; sleep 5; npm ci; }

      - name: Install Playwright Chromium + system deps
        # Required for the viewport suite (vitest browser-mode + chromium).
        # Agent VMs lack libatk/libnss/libxkbcommon by default; CI gets a
        # clean ubuntu-latest each run so we install on every job.
        working-directory: ./admin-ui
        run: npx playwright install --with-deps chromium

      - name: Build (tsc + vite)
        id: build
        continue-on-error: true
        working-directory: ./admin-ui
        env:
          VITE_API_URL: http://localhost:8080
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
        run: npm run build

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: ./admin-ui
        run: npx eslint .

      - name: Viewport tests
        id: viewport
        continue-on-error: true
        working-directory: ./admin-ui
        env:
          VITE_API_URL: http://localhost:8080
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
        run: npm run test:viewport

      # Failure screenshots are visual regressions; the stack trace alone
      # rarely makes the issue diagnosable. screenshotFailures=true in
      # vitest.viewport.config.ts writes PNGs into vitest's default browser
      # output dir(s); we glob the likely locations and let the action
      # ignore missing paths so a passing run doesn't fail this step.
      - name: Upload viewport failure screenshots
        if: steps.viewport.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: viewport-failure-screenshots
          path: |
            admin-ui/**/__screenshots__/**/*.png
            admin-ui/.vitest/**/*.png
            admin-ui/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save result for baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.viewport.outcome }}" = "failure" ]; then
            echo "BROKEN" > frontend-status.txt
          else
            echo "OK" > frontend-status.txt
          fi

      - name: Upload frontend status (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: frontend-status.txt
          key: ci-baseline-frontend-${{ github.sha }}

      - name: Load main baseline (PR only)
        if: github.event_name == 'pull_request' && (steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.viewport.outcome == 'failure')
        uses: actions/cache/restore@v4
        with:
          path: frontend-status.txt
          key: ci-baseline-frontend-${{ github.sha }}
          restore-keys: ci-baseline-frontend-

      - name: Evaluate result
        if: steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.viewport.outcome == 'failure'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f frontend-status.txt ] && grep -q "BROKEN" frontend-status.txt; then
            echo "::warning::Frontend CI failed but is also broken on main — not blocking PR"
          else
            echo "::error::Frontend CI failed (build=${{ steps.build.outcome }}, lint=${{ steps.lint.outcome }}, viewport=${{ steps.viewport.outcome }})"
            exit 1
          fi

  backend:
    name: CI / Backend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    # Top-level permissions are contents:read; backend needs write so the
    # testmon cache push step (main + success only) can force-push the
    # orphan testmon-cache branch. Other steps don't write to the repo.
    permissions:
      contents: write
      pull-requests: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_blueprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_blueprint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_URL: postgresql+asyncpg://test:test@localhost:5432/test_blueprint
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          cp CLAUDE.md backend/CLAUDE.md
          docker build -t blueprint-backend-test ./backend

      - name: Verify app imports
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ env.TEST_DB_URL }} \
            -e AGENT_JWT_SECRET=ci-test-secret \
            -e WS_TICKET_SECRET=ci-test-secret \
            blueprint-backend-test \
            python -c "from app.main import app; print(f'OK: {len(app.routes)} routes')"

      - name: Run migrations on test DB
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=${{ env.TEST_DB_URL }} \
            blueprint-backend-test \
            alembic upgrade head

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          # On main pushes only: enable testmon collection in-line so we
          # don't have to re-run the suite a second time to refresh the
          # cache. testmon's coverage tracing adds ~10-30% per-test
          # overhead, so we bump the timeout from 30→45s and skip the
          # tracing entirely on PR runs (where the cache is discarded).
          EXTRA_DOCKER_ARGS=""
          EXTRA_PYTEST_ARGS=""
          TIMEOUT=30
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            mkdir -p .testmon-out
            EXTRA_DOCKER_ARGS="-v $PWD/.testmon-out:/out -e TESTMON_DATAFILE=/out/.testmondata"
            EXTRA_PYTEST_ARGS="--testmon-noselect"
            TIMEOUT=45
          fi
          # Disable -e so pytest's non-zero exit doesn't short-circuit the failure-extraction
          # below. We propagate pytest's exit code at the end via $pytest_status.
          set +e
          # shellcheck disable=SC2086 # intentional word-split on EXTRA_*_ARGS
          docker run --rm --network host \
            -e DATABASE_URL=${{ env.TEST_DB_URL }} \
            -e USE_TEST_POSTGRES=true \
            -e AGENT_JWT_SECRET=ci-test-secret \
            -e WS_TICKET_SECRET=ci-test-secret \
            $EXTRA_DOCKER_ARGS \
            blueprint-backend-test \
            python -m pytest testing/ -v --tb=short --timeout=$TIMEOUT --timeout-method=signal --log-cli-level=WARNING $EXTRA_PYTEST_ARGS 2>&1 | tee test-output.txt
          pytest_status=${PIPESTATUS[0]}
          set -e

          # Extract failed test IDs from pytest's "short test summary info" section.
          grep -E "^FAILED " test-output.txt | sed 's/^FAILED //' | sed 's/ -.*//' | sort -u > pr-test-failures.txt || true

          # Fallback: pytest exited non-zero but printed no FAILED summary (timeout / crash /
          # collection error). Surface a sentinel + the tail so the Evaluate step is useful.
          if [ "$pytest_status" -ne 0 ] && [ ! -s pr-test-failures.txt ]; then
            echo "<pytest crashed or hung; no FAILED summary captured>" > pr-test-failures.txt
            echo ""
            echo "=== Last 50 lines of pytest output ==="
            tail -50 test-output.txt
          fi

          exit $pytest_status

      - name: Save test failures baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Save both the failure list and overall status
          if [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
            echo "BROKEN" > backend-status.txt
          else
            echo "OK" > backend-status.txt
          fi
          # Combine into one baseline file
          echo "---FAILURES---" >> backend-status.txt
          cat pr-test-failures.txt >> backend-status.txt 2>/dev/null || true

      - name: Upload backend baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: backend-status.txt
          key: ci-baseline-backend-${{ github.sha }}

      - name: Load main baseline (PR only)
        if: github.event_name == 'pull_request' && steps.run_tests.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: backend-status.txt
          key: ci-baseline-backend-${{ github.sha }}
          restore-keys: ci-baseline-backend-

      - name: Evaluate test results
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Failed tests on this PR:"
          cat pr-test-failures.txt 2>/dev/null || echo "(none captured)"

          # On main push, just fail — baseline is already saved above
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Backend tests failed on main"
            exit 1
          fi

          # On PR: compare against main baseline
          if [ ! -f backend-status.txt ]; then
            echo "No main baseline found — all failures count as new"
            exit 1
          fi

          # Extract main's failed tests from baseline
          sed -n '/---FAILURES---/,$p' backend-status.txt | tail -n +2 | sort -u > main-failures.txt

          if [ ! -s pr-test-failures.txt ]; then
            echo "::error::Backend tests failed but no specific test failures captured"
            exit 1
          fi

          # Find NEW failures (in PR but not in main)
          NEW_FAILURES=$(comm -23 pr-test-failures.txt main-failures.txt)

          if [ -n "$NEW_FAILURES" ]; then
            echo "::error::NEW test failures introduced by this PR:"
            echo "$NEW_FAILURES"
            echo ""
            echo "Tests also failing on main (not blocking):"
            comm -12 pr-test-failures.txt main-failures.txt || true
            exit 1
          fi

          echo "::warning::All test failures are inherited from main — not blocking PR"
          cat pr-test-failures.txt

      - name: Migration linter
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref || 'main' }}"
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A origin/$BASE_BRANCH -- backend/alembic/versions/*.py 2>/dev/null || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations — skipping"
            exit 0
          fi
          VIOLATIONS=$(echo "$NEW_MIGRATIONS" | xargs grep -l "nullable=False" 2>/dev/null | xargs grep -L "server_default" 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Migration safety violation: nullable=False without server_default in:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Migration linter passed"

      # The Run tests step above already populated .testmon-out/.testmondata
      # via --testmon-noselect (main pushes only). Vacuum it so the file
      # checked into the orphan branch is the compact post-WAL-checkpoint
      # version, not the larger transient form.
      - name: Vacuum testmon cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.run_tests.outcome == 'success'
        run: |
          docker run --rm \
            -v "$PWD/.testmon-out:/out" \
            blueprint-backend-test \
            python -c 'import sqlite3; c=sqlite3.connect("/out/.testmondata"); c.execute("PRAGMA wal_checkpoint(FULL)"); c.execute("VACUUM"); c.close()'
          ls -lh .testmon-out/.testmondata

      - name: Push testmon cache to orphan branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.run_tests.outcome == 'success'
        run: |
          # Move the artifact out of the working tree before we wipe it.
          cp .testmon-out/.testmondata /tmp/.testmondata-cache
          git config user.name "blueprint-bot"
          git config user.email "blueprint-bot@users.noreply.github.com"
          # Orphan branch: no merge history, single commit per main push.
          # Force-push because each refresh fully replaces the previous one;
          # there's nothing meaningful to preserve in the binary diff.
          git checkout --orphan testmon-cache-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          git clean -fdx -e .testmon-out
          cp /tmp/.testmondata-cache .testmondata
          cat > .gitignore <<'EOF'
          *
          !.testmondata
          !.gitignore
          EOF
          git add .testmondata .gitignore
          git commit -m "testmon: refresh from ${GITHUB_SHA}"
          git push --force origin testmon-cache-tmp:testmon-cache

  agent:
    name: CI / Agent
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.agent == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        working-directory: ./agent
        run: npm ci || { echo "::warning::npm ci failed (esbuild ETXTBSY postinstall race) - retrying once"; sleep 5; npm ci; }

      - name: Type check
        id: typecheck
        continue-on-error: true
        working-directory: ./agent
        run: npx tsc --noEmit

      - name: Save result for baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.typecheck.outcome }}" = "failure" ]; then
            echo "BROKEN" > agent-status.txt
          else
            echo "OK" > agent-status.txt
          fi

      - name: Upload agent status (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: agent-status.txt
          key: ci-baseline-agent-${{ github.sha }}

      - name: Load main baseline (PR only)
        if: github.event_name == 'pull_request' && steps.typecheck.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: agent-status.txt
          key: ci-baseline-agent-${{ github.sha }}
          restore-keys: ci-baseline-agent-

      - name: Evaluate result
        if: steps.typecheck.outcome == 'failure'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f agent-status.txt ] && grep -q "BROKEN" agent-status.txt; then
            echo "::warning::Agent CI failed but is also broken on main — not blocking PR"
          else
            echo "::error::Agent type check failed"
            exit 1
          fi
