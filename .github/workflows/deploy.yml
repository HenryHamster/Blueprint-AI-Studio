name: Deploy Blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend'
        type: boolean
        default: true
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  AR_REGISTRY: us-central1-docker.pkg.dev
  IMAGE: blueprint-orchestrator

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      migrations: ${{ steps.result.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'admin-ui/**'
            migrations:
              - 'backend/alembic/**'
      - id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=${{ inputs.deploy_backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
            echo "migrations=${{ inputs.run_migrations }}" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "migrations=${{ steps.filter.outputs.migrations }}" >> $GITHUB_OUTPUT
          fi

  deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Build and push
        working-directory: ./backend
        run: |
          IMAGE_URI="${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}"
          docker build -t "${IMAGE_URI}:${{ github.sha }}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}" --all-tags

      # Only update the image — all env vars, secrets, VPC config are already
      # set on the service from the initial deploy via setup.sh
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy blueprint-orchestrator \
            --image "${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}:${{ github.sha }}" \
            --region ${{ env.REGION }}

  run-migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: [detect, deploy-backend]
    # Run if migrations requested AND backend finished (or was skipped)
    if: |
      always() &&
      needs.detect.outputs.migrations == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run migrations job
        run: |
          gcloud run jobs execute blueprint-migrate \
            --region ${{ env.REGION }} \
            --wait

  deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Build frontend
        working-directory: ./admin-ui
        env:
          VITE_API_URL: ${{ secrets.ORCHESTRATOR_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase target:clear hosting admin --project ${{ env.PROJECT_ID }}
          firebase target:apply hosting admin ${{ secrets.FIREBASE_HOSTING_SITE }} --project ${{ env.PROJECT_ID }}
          firebase deploy --only hosting:admin --project ${{ env.PROJECT_ID }}
