name: Deploy Blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend'
        type: boolean
        default: true
      deploy_agent:
        description: 'Deploy Cloud Run agent job'
        type: boolean
        default: true
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false
      recovery_data_reconciled:
        description: 'I verified the recovery database is reconciled with local PostgreSQL'
        type: boolean
        default: false

concurrency:
  group: deploy-blueprint
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  AR_REGISTRY: us-central1-docker.pkg.dev
  IMAGE: blueprint-orchestrator

jobs:
  detect:
    name: Detect changes
    # Hamsterwheel is the production control plane. Even metadata-only actions
    # must run on a disposable hosted runner rather than gaining host access.
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      agent: ${{ steps.result.outputs.agent }}
      migrations: ${{ steps.result.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'admin-ui/**'
              - 'package.json'
              - 'package-lock.json'
            agent:
              - 'agent/**'
            migrations:
              - 'backend/alembic/**'
      - id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=${{ inputs.deploy_backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
            echo "agent=${{ inputs.deploy_agent }}" >> $GITHUB_OUTPUT
            echo "migrations=${{ inputs.run_migrations }}" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "agent=${{ steps.filter.outputs.agent }}" >> $GITHUB_OUTPUT
            echo "migrations=${{ steps.filter.outputs.migrations }}" >> $GITHUB_OUTPUT
          fi

  build-frontend-artifact:
    name: Build Same-Origin Frontend Artifact
    runs-on: ubuntu-latest
    needs: detect
    if: |
      needs.detect.outputs.backend == 'true' ||
      needs.detect.outputs.frontend == 'true' ||
      needs.detect.outputs.migrations == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build same-origin frontend
        working-directory: ./admin-ui
        env:
          VITE_API_URL: ''
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_EXPECTED_BACKEND_SHA: ${{ github.sha }}
        run: |
          test -z "${VITE_DASHBOARD_API_TOKEN:-}"
          npm ci
          npm run build
          python ../scripts/frontend_release_manifest.py dist "${{ github.sha }}"
          if grep -R -F 'blueprint-orchestrator-mmtfi5aysa-uc.a.run.app' admin-ui/dist; then
            echo '::error::Frontend bundle contains the retired cross-origin API endpoint'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: same-origin-frontend-${{ github.sha }}
          path: admin-ui/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [detect, build-frontend-artifact]
    if: |
      needs.detect.outputs.backend == 'true' ||
      needs.detect.outputs.frontend == 'true' ||
      needs.detect.outputs.migrations == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: same-origin-frontend-${{ github.sha }}
          path: backend/static

      - name: Reverify bounded frontend artifact
        run: |
          BUNDLE_SHA256="$(python scripts/frontend_release_manifest.py \
            --verify backend/static "${{ github.sha }}")"
          echo "FRONTEND_BUNDLE_SHA256=${BUNDLE_SHA256}" >> "${GITHUB_ENV}"
          if grep -R -F 'blueprint-orchestrator-mmtfi5aysa-uc.a.run.app' backend/static; then
            echo '::error::Frontend artifact contains the retired cross-origin API endpoint'
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Build and push
        working-directory: ./backend
        run: |
          IMAGE_URI="${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}"
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "com.blueprint.frontend.bundle-sha256=${{ env.FRONTEND_BUNDLE_SHA256 }}" \
            -t "${IMAGE_URI}:${{ github.sha }}" .
          docker push "${IMAGE_URI}:${{ github.sha }}"

      - name: Record immutable local-release manifest
        run: |
          IMAGE_URI="${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}"
          DIGEST="$(gcloud artifacts docker images describe \
            "${IMAGE_URI}:${{ github.sha }}" \
            --format='value(image_summary.digest)')"
          test "${DIGEST#sha256:}" != "${DIGEST}"
          printf '{"kind":"blueprint.local_app_release_manifest.v1","image_ref":"%s@%s","revision":"%s","frontend_bundle_sha256":"%s"}\n' \
            "${IMAGE_URI}" "${DIGEST}" "${{ github.sha }}" \
            "${{ env.FRONTEND_BUNDLE_SHA256 }}" > local-app-release.json
          sha256sum local-app-release.json > local-app-release.json.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: local-app-release-${{ github.sha }}
          path: |
            local-app-release.json
            local-app-release.json.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-agent:
    name: Cloud Run Agent Job
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.agent == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Build, push, and deploy agent image
        run: |
          IMAGE_URI="${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/blueprint-agent-job:${{ github.sha }}"
          docker build -t "${IMAGE_URI}" ./agent
          docker push "${IMAGE_URI}"
          gcloud run jobs update blueprint-agent-job \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "${IMAGE_URI}" \
            --quiet

  deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [detect, build-backend, run-migrations]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.recovery_data_reconciled == true &&
      (needs.detect.outputs.backend == 'true' || needs.detect.outputs.frontend == 'true') &&
      needs.build-backend.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP permissions
        run: |
          echo "Verifying Compute Engine access..."
          gcloud compute zones list --limit 1 --format="value(name)" > /dev/null 2>&1 \
            || { echo "::error::Service account lacks compute.zones.list permission"; exit 1; }
          echo "Verifying Secret Manager access..."
          gcloud secrets list --project ${{ env.PROJECT_ID }} --limit 1 > /dev/null 2>&1 \
            || { echo "::error::Service account lacks secretmanager.secrets.list permission"; exit 1; }
          echo "All permission checks passed."

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy blueprint-orchestrator \
            --image "${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 120 \
            --update-env-vars DEPLOY_SHA=${{ github.sha }},BLUEPRINT_PROCESS_ROLE=api

  run-migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: [detect, build-backend]
    # Only run when alembic files changed — requires fresh image from build-backend
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.recovery_data_reconciled == true &&
      needs.detect.outputs.migrations == 'true' &&
      needs.build-backend.result == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP permissions
        run: |
          echo "Verifying Cloud Run Jobs access..."
          gcloud run jobs list --region ${{ env.REGION }} --limit 1 --format="value(name)" > /dev/null 2>&1 \
            || { echo "::error::Service account lacks run.jobs.list permission"; exit 1; }
          echo "Permission check passed."

      - name: Update migration job image
        if: needs.build-backend.result == 'success'
        run: |
          IMAGE_URI="${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/blueprint-repo/${{ env.IMAGE }}:${{ github.sha }}"
          gcloud run jobs update blueprint-migrate \
            --region ${{ env.REGION }} \
            --image "${IMAGE_URI}" \
            --quiet

      - name: Run migrations
        run: |
          gcloud run jobs execute blueprint-migrate \
            --region ${{ env.REGION }} \
            --wait

  build-firebase-frontend:
    name: Build Firebase Rollback Frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build frontend
        working-directory: ./admin-ui
        env:
          VITE_API_URL: ${{ secrets.ORCHESTRATOR_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_EXPECTED_BACKEND_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          python ../scripts/frontend_release_manifest.py dist "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firebase-frontend-${{ github.sha }}
          path: admin-ui/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [detect, build-firebase-frontend]
    if: needs.detect.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firebase-frontend-${{ github.sha }}
          path: admin-ui/dist

      - name: Reverify rollback frontend artifact
        run: python scripts/frontend_release_manifest.py --verify admin-ui/dist "${{ github.sha }}"

      - name: Install Firebase deployment tool outside credential boundary
        run: |
          EXPECTED_INTEGRITY='sha512-QmMy4hnd0Q+V+7GFhZUV80+kG0WC1+UOtuaaQWx+cstt+XepUcpju/KW4cBknnyql521BghfuAhveckQQ1g+HA=='
          test "$(npm view firebase-tools@13.35.1 dist.integrity)" = "${EXPECTED_INTEGRITY}"
          npm install --global --ignore-scripts firebase-tools@13.35.1
          test "$(firebase --version)" = '13.35.1'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy to Firebase Hosting
        run: |
          firebase target:clear hosting admin --project ${{ env.PROJECT_ID }}
          firebase target:apply hosting admin ${{ secrets.FIREBASE_HOSTING_SITE }} --project ${{ env.PROJECT_ID }}
          firebase deploy --only hosting:admin --project ${{ env.PROJECT_ID }}
