name: Validate Packer Templates

# Pre-merge guard for infra/packer templates. Catches HCL parse / interpolation
# errors before they reach main — e.g. an embedded JS `${...}` template literal
# colliding with HCL's own `${...}` interpolation. The "Build Agent VM Image"
# workflow only runs `packer build` on push to main, so without this gate a
# malformed template fails *after* promotion and the agent image silently stops
# baking (the failure that motivated this workflow).

on:
  pull_request:
    paths:
      - 'infra/packer/**'
  workflow_dispatch: {}

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate-packer:
    name: Packer Validate
    # Validation receives no GCP credentials and is safe on the KVM-isolated
    # persistent CI pool. The credential-bearing image bake remains hosted.
    runs-on: [self-hosted, Linux, X64, hamsterwheel, blueprint, kvm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.1.0
        with:
          version: "1.11.2"

      - name: Packer Init
        working-directory: ./infra/packer
        run: packer init agent.pkr.hcl

      - name: Packer Validate
        working-directory: ./infra/packer
        # No GCP auth: `packer validate` checks template + plugin schema without
        # calling any cloud API. project_id is a placeholder so the var resolves
        # (its default reads env GCP_PROJECT_ID, which is unset on PRs).
        run: packer validate -var "project_id=ci-validate" agent.pkr.hcl
