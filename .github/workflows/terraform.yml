name: Terraform Infrastructure

on:
  # NOTE: the push-to-main trigger was removed (2026-06-23). The apply step in
  # this workflow is disabled (apply is run manually / locally), so a push run
  # only re-ran `terraform plan` post-merge — redundant with the pull_request
  # plan that already runs and comments on the PR. Plan on PR; apply by hand.
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/recovery/**'
  workflow_dispatch:
    # Plan-only by design. Production applies remain an explicit local operation.

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: us-central1
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_enable_cicd: "true"
  TF_VAR_orchestrator_url: ${{ secrets.ORCHESTRATOR_URL }}
  TF_VAR_alert_email: ${{ secrets.GCP_ALERT_EMAIL }}
  TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
  TF_VAR_monthly_budget_usd: "200"

jobs:
  terraform:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Validate recovery infrastructure
        working-directory: infra/recovery
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Validate production plan inputs
        shell: bash
        run: |
          set -euo pipefail
          required_inputs=(
            PROJECT_ID
            TF_VAR_alert_email
            TF_VAR_billing_account_id
            TF_VAR_orchestrator_url
          )
          for input_name in "${required_inputs[@]}"; do
            if [[ -z "${!input_name:-}" ]]; then
              echo "::error::Required Terraform plan input is missing: ${input_name}"
              exit 1
            fi
          done

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          plan_exit_code=$?
          echo "plan_exit_code=$plan_exit_code" >> "$GITHUB_OUTPUT"
          exit "$plan_exit_code"

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated' : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      # Apply is disabled until a remote backend (GCS) is configured.
      # Without remote state, CI would try to recreate all resources.
      # For now: run `./scripts/terraform.sh apply` locally.
      # - name: Terraform Apply
      #   if: >
      #     (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      #     (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
      #   run: terraform apply -auto-approve tfplan
