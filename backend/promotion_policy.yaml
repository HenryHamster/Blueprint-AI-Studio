# promotion_policy.yaml — TRUSTED CORE
#
# Defines when an `automain` release candidate is confident enough to be
# promoted to `main` (the LTS branch). The release qualifier
# (backend/app/release_qualifier.py) reads this file to score candidates.
#
# Autonomous changes to this file require human approval — it is registered
# in CRITICAL_FILES (backend/app/task_lifecycle.py). The agents build and
# qualify; a human owns the definition of "qualified".
#
# Composite confidence is a weighted sum of normalised sub-scores in [0,1],
# gated by hard blockers (CI red, smoketest startup-suite failure, or a
# deleted test file force confidence to 0). Promote when confidence is at or
# above `threshold`.

weights:
  audit: 0.40          # main-version audit of the main...automain diff
  test_erosion: 0.30   # did automain delete tests or weaken coverage vs main
  smoketest: 0.30      # qualify-time smoketest pass ratio

threshold: 0.75        # composite confidence required to promote.
# Lowered from the conservative 0.90 calibration bar to the 0.75 design target.
# Rationale: audit-precision work (the qualifier's own measurement) lands on
# automain first, so an over-strict bar can pin promotion at the imprecise audit
# and strand the very fix meant to improve it. 0.75 gives that work room to
# promote while still requiring a clear majority-confident composite.
