# promotion_policy.yaml — TRUSTED CORE
#
# Defines when an `automain` release candidate is confident enough to be
# promoted to `main` (the LTS branch). The release qualifier
# (backend/app/release_qualifier.py) reads this file to score candidates.
#
# Autonomous changes to this file require human approval — it is registered
# in CRITICAL_FILES (backend/app/task_lifecycle.py). The agents build and
# qualify; a human owns the definition of "qualified".
#
# Composite confidence is a weighted sum of normalised sub-scores in [0,1],
# gated by hard blockers (CI red or a deleted test file forces confidence to
# 0). Promotion PR CI remains the deterministic test gate. Qualifier VM
# smoketests are retired; ordinary post-promotion smoke is separate.

weights:
  audit: 0.5714285714285714  # main-version audit of the main...automain diff
  test_erosion: 0.4285714285714286 # did automain delete tests or weaken coverage vs main

threshold: 0.90        # composite confidence required to promote.
# Raised back to the conservative 0.90 calibration bar.

merge_grade_block_threshold: 0.0  # raise (>0, typically 1.0) to hard-block on blind merge-grade "misses"

# Slice 3 of the boot/env-prerequisite promotion gate (design 245212a4).
# When true, the DEPLOYED orchestrator judges each candidate's declared boot/env
# prerequisites (presence-only) against its OWN os.environ — a faithful proxy of
# the deploy-target env — and HARD-BLOCKS promotion (boot_prereq_missing) when an
# in-scope required var is absent. A failed preflight yields a deterministic,
# actionable blocker that names the exact missing prerequisite — it never degrades
# into a vague infra-failure retry loop (the v22 migration-gate lesson). A
# per-project build_config.env_preflight_enabled override and the
# runtime_config.env_preflight_enabled fleet flag take precedence over this.
env_preflight_enabled: true
