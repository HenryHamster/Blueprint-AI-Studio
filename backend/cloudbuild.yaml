substitutions:
  _ALLOWED_ORIGINS: '*'
  _ORCHESTRATOR_URL: ''
  _IMAGE_TAG: 'latest'
  # Wave F4 M6: previously hardcoded `lihuanshen123@gmail.com`. Pass via
  # --substitutions=_INITIAL_ADMIN_EMAIL=<your-email> at deploy time
  # (setup.sh wires this up automatically).
  #
  # R3-W4 H8 (audit 2026-04-30): when this substitution is left empty,
  # the deploy below sets `INITIAL_ADMIN_EMAIL=` literally on the Cloud
  # Run revision. That visible empty string is intentional — backend
  # `lifecycle.py:_seed_initial_admin` treats an empty value as
  # "not configured: do NOT seed; use the existing AllowedUser table."
  # gcloud's `--set-env-vars` has no "omit if empty" syntax and
  # splitting into a conditional `--update-env-vars` call would require
  # bash logic the cloudbuild step can't run cleanly. Operators who see
  # the empty env var on a revision should read it as "first-admin
  # seeding disabled," not as "misconfigured."
  _INITIAL_ADMIN_EMAIL: ''

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:${_IMAGE_TAG}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator', '--all-tags']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blueprint-orchestrator'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:${_IMAGE_TAG}'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'orchestrator-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      # VM_PROVISIONING_MODEL=SPOT — agent VMs use spot/preemptible pricing
      # (60-91% cheaper, ~5%% mid-task termination handled by reaper + retry).
      # Flip to STANDARD via `gcloud run services update --update-env-vars
      # VM_PROVISIONING_MODEL=STANDARD` to revert with no redeploy.
      #
      # DISABLED_REGIONS — list of regions where multi-region NAT was dropped
      # from terraform (vpc.tf). Orchestrator skips these zones at spawn time
      # with an explicit "administratively disabled (no subnet)" log.
      # Restore by re-enabling the multi-region NAT block in vpc.tf and
      # setting DISABLED_REGIONS="" here.
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=us-central1-a,VPC_NETWORK=agent-sandbox-vpc,VPC_SUBNET=agent-sandbox-subnet,AGENT_SERVICE_ACCOUNT_EMAIL=agent-naked-sa@$PROJECT_ID.iam.gserviceaccount.com,ARTIFACT_BUCKET_NAME=$PROJECT_ID-agent-artifacts,ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},ORCHESTRATOR_URL=${_ORCHESTRATOR_URL},LOCAL_MODE=false,MAX_CONCURRENT_VMS=10,INITIAL_ADMIN_EMAIL=${_INITIAL_ADMIN_EMAIL},VM_PROVISIONING_MODEL=SPOT,DISABLED_REGIONS=us-east1;us-east4;us-west1'
      - '--set-secrets'
      # ANTHROPIC_API_KEY is optional — only needed as fallback if not using Max plan auth on VM images
      # REDIS_URL removed 2026-05-02 — see redis_client.py:1-7, all consumers
      # gracefully fall back to in-memory state when REDIS_URL is unset.
      # Cloud Run runs at max_instance=1 (per cloud_run.tf scaling block) so
      # in-memory IS the source of truth. Restore: re-add the secret binding
      # here AND restore archive/redis.tf.disabled (does not yet exist; if
      # restoring re-create from git history).
      - 'DATABASE_URL=DATABASE_URL:latest,AGENT_JWT_SECRET=AGENT_JWT_SECRET:latest,WS_TICKET_SECRET=WS_TICKET_SECRET:latest,GITHUB_APP_ID=GITHUB_APP_ID:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,GITHUB_PRIVATE_KEY=GITHUB_PRIVATE_KEY:latest,GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest,ADMIN_API_KEY=ADMIN_API_KEY:latest'
      - '--no-cpu-throttling'
      - '--cpu-boost'
      - '--vpc-egress'
      - 'all-traffic'
      - '--network'
      - 'agent-sandbox-vpc'
      - '--subnet'
      - 'agent-sandbox-subnet'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:latest'
