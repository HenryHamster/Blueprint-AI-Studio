substitutions:
  # _ALLOWED_ORIGINS: comma-separated list of explicit frontend origins for CORS.
  # MUST NOT contain '*' — main.py rejects any wildcard list at startup because
  # wildcard + allow_credentials=True lets any site authenticate on behalf of
  # logged-in users (the CORS-credentials bypass). Override at deploy time with
  # the actual frontend URL, e.g.
  #   --substitutions=_ALLOWED_ORIGINS=https://my-app.web.app,http://localhost:3000
  # The localhost default below is safe but useful only for local development.
  _ALLOWED_ORIGINS: 'http://localhost:3000'
  _ORCHESTRATOR_URL: ''
  _IMAGE_TAG: 'latest'
  # Wave F4 M6: previously hardcoded `lihuanshen123@gmail.com`. Pass via
  # --substitutions=_INITIAL_ADMIN_EMAIL=<your-email> at deploy time
  # (setup.sh wires this up automatically).
  #
  # R3-W4 H8 (audit 2026-04-30): when this substitution is left empty,
  # the deploy below sets `INITIAL_ADMIN_EMAIL=` literally on the Cloud
  # Run revision. That visible empty string is intentional — backend
  # `lifecycle.py:_seed_initial_admin` treats an empty value as
  # "not configured: do NOT seed; use the existing AllowedUser table."
  # gcloud's `--set-env-vars` has no "omit if empty" syntax and
  # splitting into a conditional `--update-env-vars` call would require
  # bash logic the cloudbuild step can't run cleanly. Operators who see
  # the empty env var on a revision should read it as "first-admin
  # seeding disabled," not as "misconfigured."
  _INITIAL_ADMIN_EMAIL: ''

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:${_IMAGE_TAG}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator', '--all-tags']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blueprint-orchestrator'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:${_IMAGE_TAG}'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'orchestrator-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      # VM_PROVISIONING_MODEL=STANDARD — flipped from SPOT 2026-05-05 because
      # LLM token cost dominates VM compute cost. SPOT saves ~70%% on the VM
      # slice but each ~5%% preemption wastes the LLM tokens already spent on
      # the killed task; net savings dropped to ~0-2%% while the operational
      # tax (mis-classified preemption diagnostics, retry latency) stayed
      # constant. Re-enable via `gcloud run services update --update-env-vars
      # VM_PROVISIONING_MODEL=SPOT` if scale grows enough that the absolute
      # VM dollars matter again.
      #
      # us-east1 is the active cross-region capacity fallback; east4/west1
      # remain disabled until their subnet/router/NAT resources are restored.
      # Serialize GCE inserts across Cloud Run instances so stockouts cannot
      # create another thundering herd.
      # COMPUTE_IMAGE_BUILDER_SA / COMPUTE_IMAGE_BUILD_LOCATION /
      # COMPUTE_IMAGE_BUILD_SOURCE_BUCKET: isolated regional Cloud Build builder
      # config for project-baked compute images. The orchestrator submits builds
      # to $COMPUTE_IMAGE_BUILD_LOCATION that run AS $COMPUTE_IMAGE_BUILDER_SA
      # (the dedicated least-privilege SA in infra/terraform/iam.tf) and reads
      # its build context from $COMPUTE_IMAGE_BUILD_SOURCE_BUCKET (disposable,
      # 1-day-retention source store — NOT the general agent-artifacts bucket).
      # This is the env source of truth; cloud_run.tf mirrors it for readability.
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=us-central1-a,VPC_NETWORK=agent-sandbox-vpc,VPC_SUBNET=agent-sandbox-subnet,AGENT_SERVICE_ACCOUNT_EMAIL=agent-naked-sa@$PROJECT_ID.iam.gserviceaccount.com,ARTIFACT_BUCKET_NAME=$PROJECT_ID-agent-artifacts,ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},ORCHESTRATOR_URL=${_ORCHESTRATOR_URL},LOCAL_MODE=false,MAX_CONCURRENT_VMS=10,MAX_PROVISION_SLOTS=2,MACHINE_TYPE=n2-standard-2,INITIAL_ADMIN_EMAIL=${_INITIAL_ADMIN_EMAIL},VM_PROVISIONING_MODEL=STANDARD,DISABLED_REGIONS=us-east4;us-west1,CLOUD_RUN_JOB_NAME=projects/$PROJECT_ID/locations/us-central1/jobs/blueprint-agent-job,COMPUTE_IMAGE_BUILDER_SA=compute-image-builder-sa@$PROJECT_ID.iam.gserviceaccount.com,COMPUTE_IMAGE_BUILD_LOCATION=us-central1,COMPUTE_IMAGE_BUILD_SOURCE_BUCKET=$PROJECT_ID-compute-build-source'
      - '--set-secrets'
      # ANTHROPIC_API_KEY is optional — only needed as fallback if not using Max plan auth on VM images
      # REDIS_URL removed 2026-05-02 — see redis_client.py:1-7, all consumers
      # gracefully fall back to in-memory state when REDIS_URL is unset.
      # Cloud Run runs at max_instance=1 (per cloud_run.tf scaling block) so
      # in-memory IS the source of truth. Restore: re-add the secret binding
      # here AND restore archive/redis.tf.disabled (does not yet exist; if
      # restoring re-create from git history).
      # --set-secrets replaces the complete service list. gcloud validates every
      # named secret exists at deploy time, so a missing required secret fails
      # here with its name instead of creating a revision that crashes at boot.
      - 'DATABASE_URL=DATABASE_URL:latest,AGENT_JWT_SECRET=AGENT_JWT_SECRET:latest,WS_TICKET_SECRET=WS_TICKET_SECRET:latest,GITHUB_APP_ID=GITHUB_APP_ID:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,GITHUB_PRIVATE_KEY=GITHUB_PRIVATE_KEY:latest,GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest,ADMIN_API_KEY=ADMIN_API_KEY:latest,METRICS_TOKEN=METRICS_TOKEN:latest,GITHUB_PAT_ENCRYPTION_KEY=GITHUB_PAT_ENCRYPTION_KEY:latest'
      - '--no-cpu-throttling'
      - '--cpu-boost'
      - '--vpc-egress'
      - 'all-traffic'
      - '--network'
      - 'agent-sandbox-vpc'
      - '--subnet'
      - 'agent-sandbox-subnet'

  # Bind GITHUB_PAT_ENCRYPTION_KEY to the migration job so migration 0609 can
  # run when Cloud Build is the deploy entrypoint (setup.sh handles the
  # create-time binding; this step handles the update-image-only path used by
  # the GitHub Actions deploy workflow, which cannot bind secrets itself).
  # --update-secrets is additive and does not touch other secret bindings.
  # gcloud run jobs update --image alone preserves secrets, so this binding
  # survives the subsequent image-only update in the GHA deploy step.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        if gcloud run jobs describe blueprint-migrate --region=us-central1 --project="$PROJECT_ID" >/dev/null 2>&1; then
          gcloud run jobs update blueprint-migrate \
            --region=us-central1 \
            --project="$PROJECT_ID" \
            --update-secrets=GITHUB_PAT_ENCRYPTION_KEY=GITHUB_PAT_ENCRYPTION_KEY:latest \
            --quiet
          echo "GITHUB_PAT_ENCRYPTION_KEY bound to blueprint-migrate."
        else
          echo "blueprint-migrate job not yet provisioned; setup.sh binds the secret at create time."
        fi

  # Qualification scratch infrastructure is optional and must not participate
  # in the replace-all serving-secret contract above. Re-bind it additively
  # after each deploy only when the separately managed secret exists.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        if gcloud secrets describe MIGRATION_APPLY_SCRATCH_DATABASE_URL --project="$PROJECT_ID" >/dev/null 2>&1; then
          gcloud run services update blueprint-orchestrator \
            --region=us-central1 \
            --project="$PROJECT_ID" \
            --update-secrets=MIGRATION_APPLY_SCRATCH_DATABASE_URL=MIGRATION_APPLY_SCRATCH_DATABASE_URL:latest \
            --quiet
        else
          echo "Optional migration-apply scratch secret is not configured; serving remains available."
        fi

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/blueprint-repo/blueprint-orchestrator:latest'
