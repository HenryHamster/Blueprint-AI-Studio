[tool.ruff]
exclude = ["alembic/"]

[tool.ruff.lint]
select = [
    "DTZ",   # flake8-datetimez: catches datetime.utcnow() without tz
    "F",     # pyflakes: unused imports, undefined names, redefined vars
    "B",     # flake8-bugbear: common Python gotchas
    "BLE",   # flake8-blind-except: bare except Exception catches
    "E711",  # comparison to None (use `is` / `is not`)
    "E712",  # comparison to True/False (use `is` / `is not`)
    "E721",  # type comparison (use isinstance)
    "UP",    # pyupgrade: modernize Python syntax
    "RUF",   # ruff-specific rules: unused noqa, mutable defaults, etc.
    "C4",    # flake8-comprehensions: replace map/filter with comprehensions
    "SIM",   # flake8-simplify: simplifiable code patterns (nested if, ternary, etc.)
    "PERF",  # perflint: performance anti-patterns (unnecessary list casts, manual comprehensions)
    "TRY400", # use logger.exception in except blocks (captures traceback)
    "S110",  # forbid try/except/pass (silent failures)
]
# Skip typing-modernization rules — existing code uses Optional/List/Dict from typing and a
# mass refactor is out of scope here. New code in app/ should use built-in generics, but we
# don't force-migrate existing files via ruff.
# B008: FastAPI uses function calls (Query, Depends, Security, etc.) in default arguments —
# this is the intended DI pattern and flagging it produces 160+ false positives.
ignore = ["UP006", "UP007", "UP035", "B008"]

[tool.ruff.lint.per-file-ignores]
# shared_state.py uses datetime.utcnow() at module level (can't import _utcnow due to circular dep)
# E402: it is a thin facade that re-exports symbols from the extracted domain modules via
# deferred mid-module imports (circular-dependency / load-order) — the same intentional
# pattern already exempted for main.py / orchestrator.py above.
"app/shared_state.py" = ["DTZ", "E402"]
# Test files use convenience patterns (broad except, etc.)
# DTZ intentionally NOT suppressed — tests must use _utcnow(), not datetime.utcnow().
"testing/*" = ["BLE", "B", "F405"]
# Domain-split mega test files (refactor: split 13 mega backend test files).
# Each test_<name>__<domain>.py bucket star-imports its shared helper hub
# `_<name>_testhelpers.py`, which re-exports the complete original module
# namespace via __all__. F405 (name may be defined from star import) is
# unavoidable and intended for every helper reference in a bucket; the star
# line itself carries an inline `# noqa: F403`. The hub keeps imports/helpers
# used only by tests now living in the buckets, so F401 (unused import) is
# expected and intended there — the names are re-exports, not dead code.
# The residual monolith now holds only the run_qualification walkthrough_e2e
# slice and star-imports the same helper hub, so it needs the identical F405
# exemption as the __<domain>.py buckets.
"testing/test_release_qualifier__*.py" = ["F405"]
"testing/_release_qualifier_testhelpers.py" = ["F401"]
# main.py has many intentional except Exception blocks for background-task error handling
# B904: FastAPI pattern — raise HTTPException in except block is intentional HTTP conversion
# E402: Deferred imports for circular dependency / module load order (lines 113, 202, 2035, 2042, 2174)
"app/main.py" = ["BLE001", "B904", "E402"]
# vm_lifecycle.py / alert_dispatch.py / notification.py were extracted verbatim
# from main.py (P5 service-locator decomposition). They keep main.py's
# intentional broad-except guards: VM-teardown / GCP-count / webhook-post and
# the TASK_FAILED notification dispatch are all "log and continue — never crash
# the caller or leak a VM" paths, exactly as documented for main.py above.
# E402 for alert_dispatch.py: re-exports runner health alert helpers from
# app.runner_health_alerts via a deferred end-of-module import (after the bulk
# of the alert definitions — same intentional load-order pattern as orchestrator.py).
"app/vm_lifecycle.py" = ["BLE001"]
"app/alert_dispatch.py" = ["BLE001", "E402"]
"app/notification.py" = ["BLE001"]
"app/notification_dispatch.py" = ["BLE001"]
"app/deploy_health_alerts.py" = ["BLE001"]
# runner.py was extracted from compute.py/main.py; the intentional broad-except
# guards in next-compute-job (repo-token mint) and LLM account selection are
# "log and continue — never crash the runner poll loop" paths.
"app/routers/runner.py" = ["BLE001"]
# services.py is entirely background workers (cleanup, persist, timeout sweep, orphan
# recovery). Every except Exception is the intentional "log and continue — never crash
# the background loop" pattern; narrowing risks missing an exception type and killing
# the worker, which is strictly worse than logging an unexpected error.
# E402: re-exports stale_branch_cleanup helpers from app.branch_cleanup via a
# deferred mid-module import (load-order) — same intentional pattern as main.py.
"app/services.py" = ["BLE001", "E402"]
# recovery_sweeps.py was extracted from services.py and holds the leader-cycle
# recovery sweeps. It has since been split into recovery_evaluating.py (the
# EVALUATING-timeout sweep) and recovery_post_commit.py (post-commit-pending,
# orphan, sidecar, lane-baseline, and bootstrap recovery), leaving
# recovery_sweeps.py as a thin re-export hub. recovery_evaluating.py was in
# turn split again: its chain-inspection / CI-backstop / spend-hold helpers
# moved to recovery_evaluating_helpers.py to stay below the size cap. All of
# these submodules inherit services.py's intentional "log and continue — never
# crash the background loop" broad-except pattern, so they carry the same
# BLE001 ignore.
"app/recovery_sweeps.py" = ["BLE001"]
"app/recovery_evaluating.py" = ["BLE001"]
"app/recovery_evaluating_helpers.py" = ["BLE001"]
"app/recovery_evaluating_strand.py" = ["BLE001"]
"app/recovery_evaluating_approval.py" = ["BLE001"]
"app/recovery_post_commit.py" = ["BLE001"]
"app/recovery_post_commit_orphans.py" = ["BLE001"]
"app/recovery_post_commit_pending.py" = ["BLE001"]
"app/recovery_infrastructure.py" = ["BLE001", "PERF203"]
"app/recovery_sidecar.py" = ["BLE001"]
# lifecycle.py is the FastAPI lifespan that hosts every background service plus the
# crash-monitor and leader-election loops. BLE001 (broad except) and PERF203
# (try/except inside a loop) are both the intentional resilient-loop pattern — a
# periodic worker must survive a transient per-iteration failure, not die — exactly
# as documented for services.py above.
"app/lifecycle.py" = ["BLE001", "PERF203"]
# compute.py is the GCP compute substrate (provision/delete/serial-capture/orphan
# cleanup/secret teardown). Its except Exception blocks are the intentional
# "best-effort cloud op — log and continue, never crash the provisioning path or
# leak a VM/secret" pattern, and PERF203 flags the deliberate per-zone try/except
# inside the zone-probe/fallback loops (a zone miss must move to the next zone).
"app/compute.py" = ["BLE001", "PERF203"]
# provision_error_scope.py was extracted from compute.py (quota-scope
# classification + global/region quota cooldowns); its broad except is the same
# best-effort pattern — the global-quota operator-alert webhook must never
# break the provisioning path.
"app/provision_error_scope.py" = ["BLE001"]
# ci_completion.py is the CI webhook + poll-fallback handler. Its except blocks are the
# same "log and keep retrying" pattern (DB lookup races, GitHub API blips, merge retries).
# Crashing here would leave a PR in limbo with no progress.
"app/ci_completion.py" = ["BLE001"]
# plan_completion.py resolves criterion_ids from the direction row at spawn time.
# A lookup failure must not break the plan-decomposition loop (log-and-continue).
"app/plan_completion.py" = ["BLE001"]
# ci_merge_helpers.py was extracted from ci_completion.py; _post_merge_summary
# carries the same best-effort "log and continue" broad-except pattern.
"app/ci_merge_helpers.py" = ["BLE001"]
# task_lifecycle.py is the agent status-event dispatcher and rollup gate. Same
# log-and-continue policy: each branch handles a distinct PR / pipeline stage and
# must not crash the dispatcher on transient lookup / GitHub failures.
"app/task_lifecycle.py" = ["BLE001"]
# task_lifecycle_post_commit_terminal.py was extracted from task_lifecycle.py
# (S2 of the fdd07b88 decomposition plan); it carries the same log-and-continue
# terminal-tail pattern — each guarded section must roll back and continue so
# one failed helper (rollup, direction outcomes, remediation, qualifier
# finalize, strategic backstop) never poisons the shared session for the rest.
"app/task_lifecycle_post_commit_terminal.py" = ["BLE001"]
# task_lifecycle_completion_dispatch.py was extracted from task_lifecycle.py
# (S3 of the fdd07b88 decomposition plan); it carries the same log-and-continue
# / catch-classify-recover pattern around the completion-handler dispatch, so a
# handler failure is classified and requeued/failed rather than crashing the
# post-commit pipeline.
"app/task_lifecycle_completion_dispatch.py" = ["BLE001"]
# task_lifecycle_fix_completion.py was extracted from task_lifecycle.py
# (S4 of the fdd07b88 decomposition plan); it carries the same log-and-continue
# fix-completion pattern — each guarded section (PR state check, security scan,
# deferred review spawn) must log and continue so a transient GitHub failure
# never crashes the post-commit pipeline or strands the fix handoff.
"app/task_lifecycle_fix_completion.py" = ["BLE001"]
# review_request_changes.py was extracted from task_lifecycle.py
# (S5 of the fdd07b88 decomposition plan); it carries the same log-and-continue
# request-changes pattern — each guarded section (empty-PR probe, stale-target
# guard, authority revoke, cap-alert creation) must log and continue so a
# transient GitHub / lock failure never crashes the post-commit pipeline.
"app/review_request_changes.py" = ["BLE001"]
# agent_status.py is the /api/agent/status endpoint — same log-and-continue
# policy: each transient lookup (PR state, account info, alerts, post-commit)
# must not 500 the status POST or the agent's failure surface gets lost.
"app/routers/agent_status.py" = ["BLE001"]
# rollup_management.py runs rollup PR creation/merge under sibling-completion races,
# branch-cleanup edge cases, and concurrent worker calls. Same intentional pattern.
"app/rollup_management.py" = ["BLE001"]
# rollup_pr_verification.py and rollup_branch_cleanup.py were extracted from
# rollup_management.py; they carry the same background-worker log-and-continue
# broad-except pattern.
"app/rollup_pr_verification.py" = ["BLE001"]
"app/rollup_branch_cleanup.py" = ["BLE001"]
# rollup_migration_validation.py was extracted from rollup_management.py; its
# except blocks are the same fail-safe "could not fetch/parse the PR's migration
# files → DEFER, never merge unvalidated" pattern (GitHub API blips while listing
# PR files / diffs / target migrations). Narrowing risks merging on an unknown
# migration state — strictly worse than logging and retrying next sweep.
"app/rollup_migration_validation.py" = ["BLE001"]
# rollup_size_preflight.py uses the same fail-safe pattern: any GitHub API blip
# fetching the caps JSON, PR files, or file content → "defer" (retry next cycle),
# never merge unvalidated. Narrowing the except type risks masking transient
# network / httpx errors that don't descend from a single base class.
"app/rollup_size_preflight.py" = ["BLE001"]
# orchestrator.py is the background provisioning + monitoring loop. Same
# log-and-continue policy: crash here halts all task dispatch and health monitoring.
# E402: re-exports symbols extracted to app.orchestrator_health via deferred mid-module
# imports (circular-dependency / load-order) — the same intentional pattern as main.py.
"app/orchestrator.py" = ["BLE001", "E402"]
# orchestrator_ci_monitor.py is the EVALUATING/CI-waiting monitor sweep lifted
# verbatim out of orchestrator_worker. Same log-and-continue policy (BLE001):
# a crash in per-task CI polling must never abort the whole leader cycle.
"app/orchestrator_ci_monitor.py" = ["BLE001"]
# orchestrator_provision.py is the VM provisioning + provision-failure coroutine
# lifted verbatim out of orchestrator_worker. Same log-and-continue policy
# (BLE001): a crash mid-provision must be logged, the slot/VM cleaned up, and the
# task requeued — never propagate out and abort the dispatch loop.
"app/orchestrator_provision.py" = ["BLE001"]
# runner_health_alerts.py was extracted from alert_dispatch.py; it holds all
# runner-specific alert create/resolve helpers. Same log-and-continue policy
# (BLE001): notification dispatch and alert persistence must never crash the
# monitoring sweep that calls them.
"app/runner_health_alerts.py" = ["BLE001"]
# runner_health_monitors.py was extracted from orchestrator_runner_dispatch.py;
# it holds the periodic runner-health sweeps. PERF203 (try/except inside a loop)
# is the intentional resilient-sweep pattern — a per-runner alert failure must be
# logged and skipped, never abort the whole sweep.
"app/runner_health_monitors.py" = ["PERF203"]
# routers/agent.py re-exports the GitHub-token cache helpers extracted to
# app.github_token_resolver via a deferred mid-module import (keeps the 15+
# `from app.routers.agent import get_github_token_for_task` call sites working).
# Same intentional re-export-via-deferred-import pattern as main.py/orchestrator.py.
"app/routers/agent.py" = ["E402"]
# reaper.py imports app.reaper_sweeps mid-module (after the sweep-helper
# definitions it complements) — a deferred load-order import, the same
# intentional E402 pattern as main.py / orchestrator.py above.
"app/reaper.py" = ["E402"]
# orchestrator_runner_dispatch.py re-exports the runner eligibility predicates
# extracted to app.runner_eligibility via a deferred mid-module import (keeps the
# existing `orchestrator_runner_dispatch._runner_*` call sites and patch targets
# working). Same intentional re-export-via-deferred-import pattern as reaper.py /
# routers/agent.py above.
"app/orchestrator_runner_dispatch.py" = ["E402"]
# admin_analytics.py is read-only analytics/reporting endpoints. except blocks are
# defensive fallbacks (Cloud Logging, zone health) to show partial data instead of 500.
"app/routers/admin_analytics.py" = ["BLE001"]
# admin.py and github.py raise HTTPException inside except blocks to convert errors to HTTP responses
"app/admin.py" = ["B904"]
# E402: github.py is a thin facade that re-exports symbols from the extracted
# github_* domain modules (github_auth/checks/issues/refs/pulls/merge_summary)
# via deferred end-of-file imports placed after the core helpers to avoid
# circular-import order issues — the same intentional pattern as main.py /
# orchestrator.py above.
"app/github.py" = ["B904", "E402"]
# max_plan_pool.py hosts the account-pool background loops (recheck_disabled_accounts,
# rate-limit/usage-cap persist-retry drains). Same log-and-continue policy: a transient
# DB persist failure must be logged and retried, not crash the pool maintenance loop.
"app/max_plan_pool.py" = ["BLE001"]
# failure_classification.py is the failure classifier called in the status-handler hot
# path. Its except blocks are intentional "degrade to a safe default (e.g. False) with a
# debug log" guards — raising here would crash the caller's failure handling, which is
# strictly worse than a conservative misclassification.
"app/failure_classification.py" = ["BLE001"]
# failure_residual.py is the residual-remediation seam extracted from
# failure_classification.py; it retains the same intentional "log-and-degrade"
# broad-except guard around the fire-and-forget DB upsert.
"app/failure_residual.py" = ["BLE001"]
# digest_precompute.py is a leader-only periodic worker that primes the digest
# cache. BLE001 (broad except) and PERF203 (try/except inside a loop) are the
# same intentional resilient-loop pattern as lifecycle.py/services.py: one hot
# key's transient compute failure must be logged and skipped, not crash the
# whole precompute tick or kill the background loop.
"app/digest_precompute.py" = ["BLE001", "PERF203"]
# warm_pool_maintainer.py is the leader-only warm-pool reconcile worker + the
# idle-reaper sweep. Its broad-except guards are the same intentional
# log-and-continue resilient-loop pattern as services.py / lifecycle.py — a
# single project's reconcile / a single member's teardown must be logged and
# skipped, never crash the maintainer tick or the reaper cycle.
"app/warm_pool_maintainer.py" = ["BLE001"]
# knowledge_completion.py hosts the compute-experiment LLM analysis pass, which
# uses a try/except inside a range(2) retry loop — the same intentional parse-error
# retry pattern as review_learning.categorize_review_issues_llm. PERF203 is
# suppressed because the try/except is the retry mechanism, not a performance issue.
"app/knowledge_completion.py" = ["PERF203"]
# autonomous_research.py re-exports _spawn_residual_fingerprint_remediation from
# autonomous_research_residual via a mid-module import to satisfy existing callers
# after the residual lane was extracted to its own module (circular-dependency /
# load-order — same intentional pattern as main.py / services.py).
"app/autonomous_research.py" = ["E402"]
# release_qualifier.py declares _FORCE_PROMOTE_NOOP_STATUSES before the
# release_hotfix_promotion import to break the mutual import cycle
# (release_hotfix_promotion imports that constant at module load time).
# The imports after the constant definition are the same intentional deferred
# load-order pattern as main.py / orchestrator.py.
"app/release_qualifier.py" = ["E402"]
# _compute_scripts are baked into the GCP compute-job VM startup script as
# base64 blobs.  They are self-contained stdin/stdout/stderr scripts that must
# NEVER raise — a crash in the watcher or heartbeat helper would silence the
# liveness signal and get a live job reaped, or crash the artifact upload on
# poweroff.  The broad-except / try-except-pass patterns are intentional:
# "log and continue — never crash the background loop."
"app/_compute_scripts/*" = ["BLE001", "S110", "SIM105", "PERF203"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "alembic/",
    "testing/",
]

[[tool.mypy.overrides]]
module = ["google.*", "firebase_admin.*", "slowapi.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# httpx.Response.json() returns Any — suppress no-any-return in the GitHub API wrapper
# until a future task adds explicit cast() annotations throughout github.py
module = "app.github"
warn_return_any = false


# Run type checking: python -m mypy app/models.py app/auth.py app/security.py app/database.py app/shared_state.py

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60  # seconds; prevents hung async tests from blocking CI
timeout_method = "thread"  # works with asyncio
# --reruns is a SIGNATURE-SCOPED safety net: pytest-rerunfailures only retries
# a failure whose message matches an --only-rerun pattern, so genuine assertion
# failures still fail immediately (no masking). The patterns target async
# event-loop contamination — a pooled production-engine connection bound to a
# prior test's loop (see testing/conftest.py _dispose_production_engine_per_test,
# which fixes the root cause; this is defense-in-depth).
addopts = "-m 'not integration' --reruns 2 --only-rerun 'attached to a different loop' --only-rerun 'Event loop is closed' --splitting-algorithm least_duration"
python_classes = ["Test", "*Test"]
# Surface deprecation warnings from core runtime dependencies as errors so that
# a dependency bump that introduces a deprecated-API call fails CI immediately
# rather than silently discarding the warning until the API is removed.
# (Motivating case: httpx 0.27 deprecated app=; the suite never surfaced it;
# httpx 0.28 removed it and would have been a hard failure without this guard.)
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::DeprecationWarning:httpx",
    "error::PendingDeprecationWarning:httpx",
    "error::DeprecationWarning:starlette",
    "error::PendingDeprecationWarning:starlette",
    "error::DeprecationWarning:fastapi",
    "error::PendingDeprecationWarning:fastapi",
    "error::DeprecationWarning:sqlalchemy",
    "error::PendingDeprecationWarning:sqlalchemy",
    "error::DeprecationWarning:sqlmodel",
    "error::PendingDeprecationWarning:sqlmodel",
    "error::DeprecationWarning:pydantic",
    "error::PendingDeprecationWarning:pydantic",
    "error::DeprecationWarning:alembic",
    "error::PendingDeprecationWarning:alembic",
    "error::DeprecationWarning:uvicorn",
    "error::PendingDeprecationWarning:uvicorn",
    "error::DeprecationWarning:asyncpg",
    "error::PendingDeprecationWarning:asyncpg",
    "error::DeprecationWarning:jwt",
    "error::PendingDeprecationWarning:jwt",
]
markers = [
    "smoketest: Critical tests run by the smoketest agent after every merge to main",
    "slow: Tests that take >10s (excluded from fast test runs)",
    "integration: End-to-end tests requiring agent subprocess (run via --integration)",
    "agent_image_gate: Opt out of the default agent-image serving-gate stub fixture and drive the gate directly",
]

[tool.coverage.run]
source = ["app"]
omit = ["testing/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
