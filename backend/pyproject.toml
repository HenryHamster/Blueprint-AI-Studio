[tool.ruff]
exclude = ["alembic/"]

[tool.ruff.lint]
select = [
    "DTZ",   # flake8-datetimez: catches datetime.utcnow() without tz
    "F",     # pyflakes: unused imports, undefined names, redefined vars
    "B",     # flake8-bugbear: common Python gotchas
    "BLE",   # flake8-blind-except: bare except Exception catches
    "E711",  # comparison to None (use `is` / `is not`)
    "E712",  # comparison to True/False (use `is` / `is not`)
    "E721",  # type comparison (use isinstance)
    "UP",    # pyupgrade: modernize Python syntax
    "RUF",   # ruff-specific rules: unused noqa, mutable defaults, etc.
    "C4",    # flake8-comprehensions: replace map/filter with comprehensions
    "SIM",   # flake8-simplify: simplifiable code patterns (nested if, ternary, etc.)
    "PERF",  # perflint: performance anti-patterns (unnecessary list casts, manual comprehensions)
    "TRY400", # use logger.exception in except blocks (captures traceback)
    "S110",  # forbid try/except/pass (silent failures)
]
# Skip typing-modernization rules — existing code uses Optional/List/Dict from typing and a
# mass refactor is out of scope here. New code in app/ should use built-in generics, but we
# don't force-migrate existing files via ruff.
# B008: FastAPI uses function calls (Query, Depends, Security, etc.) in default arguments —
# this is the intended DI pattern and flagging it produces 160+ false positives.
ignore = ["UP006", "UP007", "UP035", "B008"]

[tool.ruff.lint.per-file-ignores]
# shared_state.py uses datetime.utcnow() at module level (can't import _utcnow due to circular dep)
"app/shared_state.py" = ["DTZ"]
# Test files use convenience patterns (broad except, datetime.utcnow, etc.)
"testing/*" = ["DTZ", "BLE", "B"]
# main.py has many intentional except Exception blocks for background-task error handling
# B904: FastAPI pattern — raise HTTPException in except block is intentional HTTP conversion
# E402: Deferred imports for circular dependency / module load order (lines 113, 202, 2035, 2042, 2174)
"app/main.py" = ["BLE001", "B904", "E402"]
# services.py is entirely background workers (cleanup, persist, timeout sweep, orphan
# recovery). Every except Exception is the intentional "log and continue — never crash
# the background loop" pattern; narrowing risks missing an exception type and killing
# the worker, which is strictly worse than logging an unexpected error.
"app/services.py" = ["BLE001"]
# lifecycle.py is the FastAPI lifespan that hosts every background service plus the
# crash-monitor and leader-election loops. BLE001 (broad except) and PERF203
# (try/except inside a loop) are both the intentional resilient-loop pattern — a
# periodic worker must survive a transient per-iteration failure, not die — exactly
# as documented for services.py above.
"app/lifecycle.py" = ["BLE001", "PERF203"]
# ci_completion.py is the CI webhook + poll-fallback handler. Its except blocks are the
# same "log and keep retrying" pattern (DB lookup races, GitHub API blips, merge retries).
# Crashing here would leave a PR in limbo with no progress.
"app/ci_completion.py" = ["BLE001"]
# task_lifecycle.py is the agent status-event dispatcher and rollup gate. Same
# log-and-continue policy: each branch handles a distinct PR / pipeline stage and
# must not crash the dispatcher on transient lookup / GitHub failures.
"app/task_lifecycle.py" = ["BLE001"]
# agent_status.py is the /api/agent/status endpoint — same log-and-continue
# policy: each transient lookup (PR state, account info, alerts, post-commit)
# must not 500 the status POST or the agent's failure surface gets lost.
"app/routers/agent_status.py" = ["BLE001"]
# rollup_management.py runs rollup PR creation/merge under sibling-completion races,
# branch-cleanup edge cases, and concurrent worker calls. Same intentional pattern.
"app/rollup_management.py" = ["BLE001"]
# orchestrator.py is the background provisioning + monitoring loop. Same
# log-and-continue policy: crash here halts all task dispatch and health monitoring.
# E402: re-exports symbols extracted to app.orchestrator_health via deferred mid-module
# imports (circular-dependency / load-order) — the same intentional pattern as main.py.
"app/orchestrator.py" = ["BLE001", "E402"]
# admin_analytics.py is read-only analytics/reporting endpoints. except blocks are
# defensive fallbacks (Cloud Logging, zone health) to show partial data instead of 500.
"app/routers/admin_analytics.py" = ["BLE001"]
# admin.py and github.py raise HTTPException inside except blocks to convert errors to HTTP responses
"app/admin.py" = ["B904"]
"app/github.py" = ["B904"]
# max_plan_pool.py hosts the account-pool background loops (recheck_disabled_accounts,
# rate-limit/usage-cap persist-retry drains). Same log-and-continue policy: a transient
# DB persist failure must be logged and retried, not crash the pool maintenance loop.
"app/max_plan_pool.py" = ["BLE001"]
# failure_classification.py is the failure classifier called in the status-handler hot
# path. Its except blocks are intentional "degrade to a safe default (e.g. False) with a
# debug log" guards — raising here would crash the caller's failure handling, which is
# strictly worse than a conservative misclassification.
"app/failure_classification.py" = ["BLE001"]
# digest_precompute.py is a leader-only periodic worker that primes the digest
# cache. BLE001 (broad except) and PERF203 (try/except inside a loop) are the
# same intentional resilient-loop pattern as lifecycle.py/services.py: one hot
# key's transient compute failure must be logged and skipped, not crash the
# whole precompute tick or kill the background loop.
"app/digest_precompute.py" = ["BLE001", "PERF203"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "alembic/",
    "testing/",
]

[[tool.mypy.overrides]]
module = ["google.*", "firebase_admin.*", "slowapi.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# httpx.Response.json() returns Any — suppress no-any-return in the GitHub API wrapper
# until a future task adds explicit cast() annotations throughout github.py
module = "app.github"
warn_return_any = false


# Run type checking: python -m mypy app/models.py app/auth.py app/security.py app/database.py app/shared_state.py

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60  # seconds; prevents hung async tests from blocking CI
timeout_method = "thread"  # works with asyncio
# --reruns is a SIGNATURE-SCOPED safety net: pytest-rerunfailures only retries
# a failure whose message matches an --only-rerun pattern, so genuine assertion
# failures still fail immediately (no masking). The patterns target async
# event-loop contamination — a pooled production-engine connection bound to a
# prior test's loop (see testing/conftest.py _dispose_production_engine_per_test,
# which fixes the root cause; this is defense-in-depth).
addopts = "-m 'not integration' --reruns 2 --only-rerun 'attached to a different loop' --only-rerun 'Event loop is closed'"
markers = [
    "smoketest: Critical tests run by the smoketest agent after every merge to main",
    "slow: Tests that take >10s (excluded from fast test runs)",
    "integration: End-to-end tests requiring agent subprocess (run via --integration)",
]

[tool.coverage.run]
source = ["app"]
omit = ["testing/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
