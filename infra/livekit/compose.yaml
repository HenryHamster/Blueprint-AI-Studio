# Caddy uses host networking for the public HTTPS endpoint. LiveKit is bridged
# only so its internal TURN/TLS port 443 can be mapped to 5349 for the separate
# GCE TCP proxy, while still advertising external port 443 to clients.
name: blueprint-livekit

services:
  livekit:
    # v1.9.12 multi-platform index digest. Upgrade only through the runbook after
    # staging validation; do not replace this with a mutable tag.
    image: livekit/livekit-server:v1.9.12@sha256:2c13cbf2edcbf13ea7b20d05c10b394d04d8fb3fe358269cff845a90b4de9576
    command: ["--config", "/run/blueprint-livekit/livekit.yaml"]
    user: "${BLUEPRINT_LIVEKIT_UID:?set by the systemd unit}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - ${BLUEPRINT_LIVEKIT_RUNTIME_DIR:?set by the systemd unit}:/run/blueprint-livekit:ro
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:6789:6789/tcp"
      # The GCE TCP proxy's backend is this VM:5349. Production keeps the
      # default internal/advertised port 443; direct staging can explicitly
      # set LIVEKIT_TURN_TLS_PORT=5349 without changing the public bind.
      - "5349:${LIVEKIT_TURN_TLS_PORT:-443}/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-60000:50000-60000/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: "no"
    stop_grace_period: 45s

  caddy:
    # v2.10.2 multi-platform index digest. Caddy provides the trusted HTTPS/WSS
    # endpoint; embedded TURN/TLS remains terminated by LiveKit on 5349.
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    env_file:
      - ${BLUEPRINT_LIVEKIT_CONFIG_DIR:?set by the systemd unit}/public.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BLUEPRINT_LIVEKIT_STATE_DIR:?set by the systemd unit}/caddy-data:/data
      - ${BLUEPRINT_LIVEKIT_STATE_DIR:?set by the systemd unit}/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: "no"
    stop_grace_period: 15s
