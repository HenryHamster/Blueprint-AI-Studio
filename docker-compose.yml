version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD?}@db:5432/postgres
      - AGENT_JWT_SECRET=${AGENT_JWT_SECRET?}
      - WS_TICKET_SECRET=${WS_TICKET_SECRET?}
      - GITHUB_APP_ID=${GITHUB_APP_ID?}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY?}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET?}
      - ORCHESTRATOR_URL=http://app:8080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOCAL_MODE=${LOCAL_MODE:-false}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
      - MAX_CONCURRENT_VMS=${MAX_CONCURRENT_VMS:-5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
